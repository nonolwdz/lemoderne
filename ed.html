<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Moderne — Éditeur</title>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primaire: #4f46e5; --secondaire: #ec4899; --fond: #f8fafc; --texte: #0f172a; --bordure: #e2e8f0; }
        *, *::before, *::after { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--fond); color: var(--texte); margin: 0; }
        
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #0f172a; }
        #login-screen h1 { color: white; margin-bottom: 25px; font-size: 2.2rem; font-weight: 800; }
        #password-input { padding: 14px 18px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; font-size: 1rem; margin-bottom: 15px; width: 280px; outline: none; }
        .btn-primaire { background: var(--primaire); color: white; padding: 12px 24px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.95rem; transition: 0.2s; }
        .btn-primaire:hover { opacity: 0.9; }
        
        #editor-dashboard { display: none; }
        header { background: white; padding: 18px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--bordure); }
        header h1 { margin: 0; font-size: 1.3rem; font-weight: 800; color: var(--texte); }
        
        .tabs { display: flex; background: white; padding: 0 40px; border-bottom: 1px solid var(--bordure); overflow-x: auto; }
        .tab-btn { background: none; border: none; padding: 15px 20px; font-size: 0.95rem; color: #64748b; cursor: pointer; border-bottom: 2px solid transparent; font-weight: 600; white-space: nowrap; }
        .tab-btn.active { color: var(--primaire); border-bottom-color: var(--primaire); }
        
        .container { max-width: 950px; margin: 30px auto; background: white; padding: 35px; border-radius: 12px; border: 1px solid var(--bordure); }
        .section { display: none; }
        .section.active { display: block; }
        
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; color: #334155; }
        .input-group input, .input-group select, .input-group textarea { width: 100%; padding: 12px; border: 1px solid var(--bordure); border-radius: 6px; font-size: 0.95rem; outline: none; background: #fff; }
        .input-group input:focus, .input-group select:focus, .input-group textarea:focus { border-color: var(--primaire); }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .grid-3 { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 15px; }
        
        .editor-container { height: 260px; border-radius: 0 0 6px 6px; font-size: 1rem; }
        .ql-toolbar { border-radius: 6px 6px 0 0; background: #f8fafc; border-color: var(--bordure); }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border: 1px solid var(--bordure); border-radius: 8px; margin-bottom: 10px; background: #f8fafc; }
        .btn-danger { background: #fee2e2; color: #dc2626; border: 1px solid #fecdd3; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
        
        .preview-crop-box { width: 100%; height: 160px; border-radius: 8px; overflow: hidden; background: #e2e8f0; border: 1px solid var(--bordure); margin-top: 10px; display: none; }
        .preview-crop-img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>
    <div id="login-screen">
        <h1>Le Moderne <span style="font-size: 0.9rem; font-weight: 400; opacity: 0.7;">ÉDITEUR</span></h1>
        <input type="password" id="password-input" placeholder="Mot de passe">
        <button class="btn-primaire" onclick="checkPassword()">Accéder au tableau de bord</button>
    </div>

    <div id="editor-dashboard">
        <header>
            <h1>Le Moderne — Administration</h1>
            <button onclick="location.reload()" style="background: none; border: 1px solid var(--bordure); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.85rem;">Déconnexion</button>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('articles', this)">Articles</button>
            <button class="tab-btn" onclick="switchTab('themes', this)">Rubriques</button>
            <button class="tab-btn" onclick="switchTab('offres', this)">Offres</button>
            <button class="tab-btn" onclick="switchTab('lecteurs', this)">Lecteurs (CRM)</button>
            <button class="tab-btn" onclick="switchTab('messages', this)">Messages 📥</button>
            <button class="tab-btn" onclick="switchTab('parametres', this)" style="color: #dc2626;">Paramètres</button>
        </div>

        <div class="container">
            <!-- ARTICLES -->
            <div id="section-articles" class="section active">
                <div class="input-group" style="background: #f8fafc; padding: 15px; border-radius: 6px; border: 1px dashed var(--primaire);">
                    <select id="select-article" onchange="chargerArticlePourEdition()"><option value="">✨ Rédiger un nouvel article</option></select>
                </div>
                
                <div class="grid-2">
                    <div class="input-group"><label>Titre de l'article</label><input type="text" id="titre-article"></div>
                    <div class="input-group"><label>Rubrique</label><select id="categorie-article"><option value="">— Choisir —</option></select></div>
                </div>

                <div class="input-group">
                    <label>URL de l'image de couverture</label>
                    <input type="text" id="image-article" placeholder="https://..." oninput="updateImagePreview()">
                </div>

                <div class="grid-2" style="background:#f8fafc; padding:15px; border-radius:8px; border:1px solid var(--bordure);">
                    <div>
                        <label style="font-weight:600; font-size:0.9rem;">Ajustement vertical du cadrage : <span id="pos-val">50%</span></label>
                        <input type="range" id="image-position" min="0" max="100" value="50" style="width:100%; margin-top:8px;" oninput="updateImagePreview()">
                        <small style="color:#64748b;">0% = Haut de l'image | 50% = Centré | 100% = Bas</small>
                    </div>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <input type="checkbox" id="est-a-la-une" style="width:20px; height:20px; cursor:pointer;">
                        <label style="margin:0; cursor:pointer; font-weight:600;">🌟 Mettre « À la une »</label>
                    </div>
                </div>

                <div id="preview-box" class="preview-crop-box">
                    <img id="preview-img" class="preview-crop-img" src="" alt="Aperçu cadrage">
                </div>

                <div class="input-group" style="margin-top:20px;">
                    <label style="color: #059669;">1. Partie gratuite (visible par tous)</label>
                    <div id="quill-public" class="editor-container"></div>
                </div>
                
                <div class="input-group">
                    <label style="color: #dc2626;">2. Partie réservée aux abonnés (déclenche le paywall)</label>
                    <div id="quill-premium" class="editor-container"></div>
                </div>

                <div style="display: flex; gap: 15px; margin-top: 25px;">
                    <button class="btn-primaire" id="btn-save-article" onclick="sauvegarderArticle()" style="flex: 1; padding: 14px;">Publier l'article</button>
                    <button class="btn-danger" id="btn-delete-article" onclick="supprimerArticle()" style="display: none;">Supprimer</button>
                </div>
            </div>

            <!-- RUBRIQUES -->
            <div id="section-themes" class="section">
                <h3 style="margin-top:0;">Gestion des rubriques</h3>
                <div class="grid-2" style="align-items: end; margin-bottom: 30px;">
                    <div class="input-group" style="margin-bottom: 0;"><label>Nom de la rubrique</label><input type="text" id="nom-theme"></div>
                    <button class="btn-primaire" onclick="creerTheme()">Ajouter</button>
                </div>
                <div id="liste-themes-admin"></div>
            </div>

            <!-- OFFRES -->
            <div id="section-offres" class="section">
                <div class="input-group" style="background: #f8fafc; padding: 15px; border-radius: 6px; border: 1px dashed var(--secondaire);">
                    <select id="select-offre" onchange="chargerOffrePourEdition()"><option value="">✨ Créer une NOUVELLE offre</option></select>
                </div>
                <div class="grid-2">
                    <div class="input-group"><label>Nom de l'offre</label><input type="text" id="nom-offre"></div>
                    <div class="input-group"><label>Prix (€ / mois)</label><input type="number" id="prix-offre" step="0.01"></div>
                </div>
                <div class="grid-2">
                    <div class="input-group"><label>Lien Stripe (price_xxx)</label><input type="text" id="lien-stripe"></div>
                    <div class="input-group"><label>Articles à offrir par mois</label><input type="number" id="partages-offre" value="0"></div>
                </div>
                <div class="input-group"><label>Avantages (un par ligne)</label><textarea id="avantages-offre" rows="4"></textarea></div>
                <button class="btn-primaire" id="btn-save-offre" onclick="sauvegarderOffre()" style="width: 100%; padding: 14px;">Enregistrer l'offre</button>
            </div>

            <!-- CRM LECTEURS -->
            <div id="section-lecteurs" class="section">
                <h3 style="margin-top:0;">Gestion des abonnés</h3>
                <div class="input-group" style="display:flex; gap:10px; margin-bottom: 20px;">
                    <input type="email" id="recherche-email" placeholder="Rechercher un email..." style="flex:1;">
                    <button class="btn-primaire" onclick="rechercherLecteur()">Rechercher</button>
                </div>

                <div id="fiche-lecteur" style="display:none; background:#f8fafc; border:1px solid var(--bordure); padding:20px; border-radius:8px; margin-bottom:20px;"></div>

                <div id="actions-lecteur" style="display:none; border-top:1px dashed var(--bordure); padding-top:20px;">
                    <h4 style="margin-top:0;">Modifier manuellement l'accès</h4>
                    <div class="input-group">
                        <label>Offre associée</label>
                        <select id="offre-attribuee"><option value="">— Ne pas modifier l'offre —</option></select>
                    </div>
                    <div class="grid-2">
                        <div class="input-group"><label>Action</label><select id="action-lecteur"><option value="ajouter">Ajouter des jours</option><option value="retirer">Retirer des jours</option></select></div>
                        <div class="input-group"><label>Nombre de jours</label><input type="number" id="jours-lecteur" value="30"></div>
                    </div>
                    <button class="btn-primaire" onclick="gererAbonnement()" style="width: 100%; padding: 12px;">Appliquer les modifications</button>
                </div>
            </div>

            <!-- MESSAGES -->
            <div id="section-messages" class="section">
                <h3 style="margin-top:0;">Boîte de réception</h3>
                <div id="liste-messages"></div>
            </div>

            <!-- PARAMÈTRES -->
            <div id="section-parametres" class="section">
                <h3 style="margin-top:0;">Paramètres généraux</h3>
                <div class="input-group">
                    <label>Texte du bandeau Flash</label>
                    <textarea id="texte-flash" rows="3"></textarea>
                    <button class="btn-primaire" onclick="sauvegarderFlash()" style="margin-top:10px;">Mettre à jour le flash</button>
                </div>
                <div style="background: #fee2e2; border: 1px solid #fecdd3; padding: 25px; border-radius: 8px; margin-top: 40px; text-align: center;">
                    <h4 style="margin: 0 0 10px 0; color: #991b1b;">Mode maintenance</h4>
                    <button id="btn-maintenance" class="btn-danger" style="padding: 10px 20px;" onclick="toggleMaintenance()">Chargement...</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script>
        const supabaseUrl = 'https://zbuwjvbcxqxtwughuadf.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpidXdqdmJjeHF4dHd1Z2h1YWRmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyMDc2ODAsImV4cCI6MjEwMjc4MzY4MH0.lO0FizbO5jnRvRjrMERCKe6cBFFN_ttBMlRAGXtlHyo';
        const db = supabase.createClient(supabaseUrl, supabaseKey);

        let listeArticles = [], listeCategories = [], listeOffres = [];
        let articleEditionId = null, offreEditionId = null, enMaintenance = false, lecteurEnCours = null;

        const quillOptions = { theme: 'snow', modules: { toolbar: [ [{ 'header': [1, 2, false] }], ['bold', 'italic', 'blockquote'], ['link', 'image'], [{'list': 'bullet'}], ['clean'] ] } };
        var quillPublic = new Quill('#quill-public', { ...quillOptions, placeholder: 'Introduction accessible à tous...' });
        var quillPremium = new Quill('#quill-premium', { ...quillOptions, placeholder: 'Contenu réservé aux abonnés...' });

        async function checkPassword() {
            if (document.getElementById('password-input').value === 'ided13') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('editor-dashboard').style.display = 'block';
                await chargerToutesLesDonnees();
            } else { alert('Mot de passe incorrect.'); }
        }

        function switchTab(sectionId, element) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('section-' + sectionId).classList.add('active'); 
            element.classList.add('active');
        }

        function updateImagePreview() {
            const url = document.getElementById('image-article').value.trim();
            const pos = document.getElementById('image-position').value;
            document.getElementById('pos-val').innerText = pos + '%';
            
            const box = document.getElementById('preview-box');
            const img = document.getElementById('preview-img');
            
            if(url) {
                img.src = url;
                img.style.objectPosition = `center ${pos}%`;
                box.style.display = 'block';
            } else {
                box.style.display = 'none';
            }
        }

        async function chargerToutesLesDonnees() {
            const { data: cats } = await db.from('categories').select('*').order('nom');
            listeCategories = cats || [];
            const selectCat = document.getElementById('categorie-article');
            const conteneurThemes = document.getElementById('liste-themes-admin');
            selectCat.innerHTML = '<option value="">— Choisir —</option>'; conteneurThemes.innerHTML = '';
            listeCategories.forEach(c => { selectCat.innerHTML += `<option value="${c.id}">${c.nom}</option>`; conteneurThemes.innerHTML += `<div class="list-item"><b>${c.nom}</b><button class="btn-danger" onclick="supprimerTheme('${c.id}')">Supprimer</button></div>`; });

            const { data: arts } = await db.from('articles').select('*').order('date_publication', { ascending: false });
            listeArticles = arts || [];
            const selectArt = document.getElementById('select-article');
            selectArt.innerHTML = '<option value="">✨ Rédiger un nouvel article</option>';
            listeArticles.forEach(a => selectArt.innerHTML += `<option value="${a.id}">📝 Éditer : ${a.titre}</option>`);

            const { data: offs } = await db.from('offres').select('*').order('prix_euros');
            listeOffres = offs || [];
            const selectOff = document.getElementById('select-offre');
            const selectOffreLecteur = document.getElementById('offre-attribuee');
            selectOff.innerHTML = '<option value="">✨ Créer une NOUVELLE offre</option>';
            selectOffreLecteur.innerHTML = '<option value="">— Ne pas modifier l\'offre —</option>';
            listeOffres.forEach(o => { 
                selectOff.innerHTML += `<option value="${o.id}">⚙️ Éditer : ${o.nom}</option>`;
                selectOffreLecteur.innerHTML += `<option value="${o.id}">${o.nom} (${o.prix_euros}€)</option>`;
            });

            const { data: settings } = await db.from('site_settings').select('*').eq('id', 1).single();
            if (settings) { enMaintenance = settings.en_maintenance; document.getElementById('texte-flash').value = settings.flash_texte || ''; actualiserBoutonMaintenance(); }
            chargerMessages();
        }

        function chargerArticlePourEdition() {
            articleEditionId = document.getElementById('select-article').value;
            if (!articleEditionId) {
                document.getElementById('titre-article').value = '';
                document.getElementById('image-article').value = '';
                document.getElementById('image-position').value = '50';
                document.getElementById('categorie-article').value = '';
                document.getElementById('est-a-la-une').checked = false;
                quillPublic.root.innerHTML = '';
                quillPremium.root.innerHTML = '';
                document.getElementById('btn-save-article').innerText = "Publier l'article";
                document.getElementById('btn-delete-article').style.display = 'none';
            } else {
                const art = listeArticles.find(a => a.id.toString() === articleEditionId.toString());
                document.getElementById('titre-article').value = art.titre;
                document.getElementById('image-article').value = art.image_url || '';
                
                let numPos = parseInt(art.image_position) || 50;
                document.getElementById('image-position').value = numPos;
                
                document.getElementById('categorie-article').value = art.categorie_id || '';
                document.getElementById('est-a-la-une').checked = art.est_a_la_une || false;
                quillPublic.root.innerHTML = art.contenu_public || '';
                quillPremium.root.innerHTML = art.contenu_premium || '';
                document.getElementById('btn-save-article').innerText = "Enregistrer les modifications";
                document.getElementById('btn-delete-article').style.display = 'block';
            }
            updateImagePreview();
        }

        async function sauvegarderArticle() {
            const posVal = document.getElementById('image-position').value + '%';
            const payload = {
                titre: document.getElementById('titre-article').value.trim(),
                image_url: document.getElementById('image-article').value.trim(),
                image_position: posVal,
                categorie_id: document.getElementById('categorie-article').value || null,
                est_a_la_une: document.getElementById('est-a-la-une').checked,
                contenu_public: quillPublic.root.innerHTML === '<p><br></p>' ? '' : quillPublic.root.innerHTML,
                contenu_premium: quillPremium.root.innerHTML === '<p><br></p>' ? null : quillPremium.root.innerHTML
            };
            payload.reserve_abonnes = payload.contenu_premium !== null && payload.contenu_premium !== '';
            
            if(!payload.titre) return alert("Le titre est obligatoire.");
            const req = articleEditionId ? db.from('articles').update(payload).eq('id', articleEditionId) : db.from('articles').insert([payload]);
            const { error } = await req;
            if(error) alert("Erreur : " + error.message);
            else { alert("✅ Article enregistré avec succès !"); chargerToutesLesDonnees(); }
        }

        async function supprimerArticle() {
            if(!articleEditionId || !confirm("Confirmer la suppression définitive ?")) return;
            const { error } = await db.from('articles').delete().eq('id', articleEditionId);
            if(error) alert("Erreur : " + error.message);
            else { document.getElementById('select-article').value = ''; chargerArticlePourEdition(); chargerToutesLesDonnees(); }
        }

        async function rechercherLecteur() {
            const email = document.getElementById('recherche-email').value.trim();
            if(!email) return alert("Saisis une adresse e-mail.");
            
            const { data: lecteur, error } = await db.from('lecteurs').select('*').eq('email', email).single();
            if(error || !lecteur) {
                alert("Lecteur introuvable.");
                document.getElementById('fiche-lecteur').style.display = 'none';
                document.getElementById('actions-lecteur').style.display = 'none';
                return;
            }
            
            lecteurEnCours = lecteur;
            const isAbonne = lecteur.est_abonne && new Date(lecteur.fin_abonnement) > new Date();
            const dateFin = lecteur.fin_abonnement ? new Date(lecteur.fin_abonnement).toLocaleDateString('fr-FR') : '—';

            document.getElementById('fiche-lecteur').innerHTML = `
                <div style="font-weight:700; margin-bottom:8px; font-size:1.1rem;">👤 ${lecteur.prenom || 'Utilisateur'} (${lecteur.email})</div>
                <div style="font-size:0.95rem; color:#475569;">
                    Statut : <b>${isAbonne ? (lecteur.offre_nom || 'Abonné') : 'Gratuit'}</b> — Échéance : <b>${dateFin}</b> — Cadeaux restants : <b>${lecteur.credits_partage || 0}</b>
                </div>
            `;
            document.getElementById('fiche-lecteur').style.display = 'block';
            document.getElementById('actions-lecteur').style.display = 'block';
        }

        async function gererAbonnement() {
            if(!lecteurEnCours) return;
            const action = document.getElementById('action-lecteur').value; 
            const jours = parseInt(document.getElementById('jours-lecteur').value);
            const offreId = document.getElementById('offre-attribuee').value;
            if(isNaN(jours)) return alert("Durée invalide.");

            let nouvelleDate = new Date(); 
            if (lecteurEnCours.fin_abonnement && new Date(lecteurEnCours.fin_abonnement) > nouvelleDate) {
                nouvelleDate = new Date(lecteurEnCours.fin_abonnement);
            }
            if (action === 'ajouter') nouvelleDate.setDate(nouvelleDate.getDate() + jours); 
            else { nouvelleDate.setDate(nouvelleDate.getDate() - jours); if (nouvelleDate < new Date()) nouvelleDate = new Date(); }

            let payload = { est_abonne: nouvelleDate > new Date(), fin_abonnement: nouvelleDate.toISOString() };
            if (action === 'ajouter' && offreId !== "") {
                const off = listeOffres.find(o => o.id.toString() === offreId.toString());
                if (off) {
                    payload.offre_nom = off.nom; payload.offre_prix = off.prix_euros; payload.abonnement_offert = true; payload.credits_partage = off.partages_autorises || 0;
                }
            }

            const { error } = await db.from('lecteurs').update(payload).eq('id', lecteurEnCours.id);
            if(error) alert(error.message); else { alert("✅ Compte mis à jour."); rechercherLecteur(); }
        }

        async function chargerMessages() {
            const { data: msgs } = await db.from('messages_contact').select('*').order('date_envoi', { ascending: false });
            const conteneur = document.getElementById('liste-messages');
            conteneur.innerHTML = '';
            if(!msgs || msgs.length === 0) { conteneur.innerHTML = '<p style="color: #64748b; font-size:0.9rem;">Aucun message reçu.</p>'; return; }

            msgs.forEach(m => {
                const date = new Date(m.date_envoi).toLocaleString('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
                let repHtml = m.reponse ? `<div style="background:#eff6ff; padding:10px; border-radius:6px; margin-top:8px; font-size:0.9rem; color:#1e40af;"><b>Réponse envoyée :</b> ${m.reponse}</div>` :
                `<div style="margin-top:10px; display:flex; gap:8px;">
                    <input type="text" id="rep-${m.id}" placeholder="Taper une réponse..." style="flex:1; padding:8px; border:1px solid #cbd5e1; border-radius:4px;">
                    <button class="btn-primaire" style="padding:8px 12px; font-size:0.85rem;" onclick="envoyerReponse(${m.id})">Envoyer</button>
                </div>`;

                conteneur.innerHTML += `
                    <div class="list-item" style="flex-direction:column; align-items:flex-start; margin-bottom:15px; padding:20px;">
                        <div style="display:flex; justify-content:space-between; width:100%; font-size:0.85rem; color:#64748b;">
                            <b>${m.email}</b><span>${date}</span>
                        </div>
                        <p style="margin:8px 0; font-size:1rem; color:#334155;">${m.message}</p>
                        ${repHtml}
                    </div>`;
            });
        }

        async function envoyerReponse(id) {
            const rep = document.getElementById(`rep-${id}`).value.trim();
            if(!rep) return;
            await db.from('messages_contact').update({ reponse: rep, lu_par_lecteur: false }).eq('id', id);
            chargerMessages();
        }

        function chargerOffrePourEdition() {
            offreEditionId = document.getElementById('select-offre').value;
            if (!offreEditionId) {
                document.getElementById('nom-offre').value = ''; document.getElementById('prix-offre').value = ''; document.getElementById('partages-offre').value = '0'; document.getElementById('lien-stripe').value = ''; document.getElementById('avantages-offre').value = ''; document.getElementById('btn-save-offre').innerText = "Créer l'offre";
            } else {
                const off = listeOffres.find(o => o.id.toString() === offreEditionId.toString());
                document.getElementById('nom-offre').value = off.nom; document.getElementById('prix-offre').value = off.prix_euros; document.getElementById('partages-offre').value = off.partages_autorises; document.getElementById('lien-stripe').value = off.stripe_price_id; document.getElementById('avantages-offre').value = off.avantages || ''; document.getElementById('btn-save-offre').innerText = "Enregistrer l'offre";
            }
        }

        async function sauvegarderOffre() {
            const payload = { nom: document.getElementById('nom-offre').value.trim(), prix_euros: parseFloat(document.getElementById('prix-offre').value), stripe_price_id: document.getElementById('lien-stripe').value.trim(), partages_autorises: parseInt(document.getElementById('partages-offre').value), avantages: document.getElementById('avantages-offre').value };
            if(!payload.nom || isNaN(payload.prix_euros)) return alert("Nom et prix requis.");
            const req = offreEditionId ? db.from('offres').update(payload).eq('id', offreEditionId) : db.from('offres').insert([payload]);
            await req; chargerToutesLesDonnees();
        }

        async function creerTheme() { const nom = document.getElementById('nom-theme').value.trim(); if(!nom) return; await db.from('categories').insert([{ nom }]); document.getElementById('nom-theme').value = ''; chargerToutesLesDonnees(); }
        async function supprimerTheme(id) { if(!confirm("Supprimer ?")) return; await db.from('categories').delete().eq('id', id); chargerToutesLesDonnees(); }
        async function sauvegarderFlash() { await db.from('site_settings').update({ flash_texte: document.getElementById('texte-flash').value }).eq('id', 1); alert("Flash mis à jour."); }
        function actualiserBoutonMaintenance() { const btn = document.getElementById('btn-maintenance'); btn.innerText = enMaintenance ? "DÉSACTIVER la maintenance" : "ACTIVER la maintenance"; }
        async function toggleMaintenance() { enMaintenance = !enMaintenance; await db.from('site_settings').update({ en_maintenance: enMaintenance }).eq('id', 1); actualiserBoutonMaintenance(); }
    </script>
</body>
</html>
