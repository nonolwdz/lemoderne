<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Moderne - Éditeur</title>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primaire: #4f46e5; --secondaire: #ec4899; --fond: #f8fafc; --texte: #1e293b; --bordure: #e2e8f0; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--fond); color: var(--texte); margin: 0; }
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #0f172a; }
        #login-screen h1 { color: white; margin-bottom: 30px; font-size: 2.5rem; }
        #password-input { padding: 15px 20px; border-radius: 8px; border: none; font-size: 1.1rem; margin-bottom: 20px; width: 300px; }
        .btn-primaire { background: linear-gradient(135deg, var(--primaire), var(--secondaire)); color: white; padding: 12px 24px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.2s;}
        .btn-primaire:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); }
        #editor-dashboard { display: none; }
        header { background: white; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--bordure); }
        header h1 { margin: 0; font-size: 1.5rem; background: linear-gradient(135deg, var(--primaire), var(--secondaire)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .tabs { display: flex; background: white; padding: 0 40px; border-bottom: 1px solid var(--bordure); overflow-x: auto; }
        .tab-btn { background: none; border: none; padding: 15px 20px; font-size: 1rem; color: #64748b; cursor: pointer; border-bottom: 3px solid transparent; font-weight: 600; white-space: nowrap; transition: 0.2s; }
        .tab-btn:hover { color: var(--texte); }
        .tab-btn.active { color: var(--primaire); border-bottom-color: var(--primaire); }
        .container { max-width: 1000px; margin: 40px auto; background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px -10px rgba(0,0,0,0.05); border: 1px solid var(--bordure); }
        .section { display: none; }
        .section.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .input-group { margin-bottom: 25px; }
        .input-group label { display: block; font-weight: 600; margin-bottom: 8px; color: #334155; }
        .input-group input, .input-group select, .input-group textarea { width: 100%; padding: 14px; border: 1px solid var(--bordure); border-radius: 8px; font-size: 1rem; box-sizing: border-box; outline: none; transition: border-color 0.2s; }
        .input-group input:focus, .input-group select:focus, .input-group textarea:focus { border-color: var(--primaire); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .editor-container { height: 280px; border-radius: 0 0 8px 8px; font-size: 1.05rem; }
        .ql-toolbar { border-radius: 8px 8px 0 0; background: #f8fafc; border-color: var(--bordure); }
        .box-info { background: #eff6ff; border: 1px solid #bfdbfe; padding: 15px; border-radius: 8px; margin-bottom: 20px; color: #1e3a8a; font-size: 0.95rem; }
        .list-item { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; padding: 15px; border: 1px solid var(--bordure); border-radius: 8px; margin-bottom: 10px; background: #f8fafc; gap: 10px; }
        .btn-danger { background: #fee2e2; color: #dc2626; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-danger:hover { background: #fecdd3; }
        
        .preview-crop-box { width: 100%; height: 200px; border-radius: 8px; overflow: hidden; background: linear-gradient(135deg, #f1f5f9, #e2e8f0); border: 1px solid var(--bordure); margin-top: 15px; display: none; position: relative; }
        .preview-crop-img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>
    <div id="login-screen">
        <h1>Le Moderne <span style="font-size: 1rem; opacity: 0.8;">ÉDITEUR</span></h1>
        <input type="password" id="password-input" placeholder="Mot de passe">
        <button class="btn-primaire" onclick="checkPassword()">Accéder au tableau de bord</button>
    </div>

    <div id="editor-dashboard">
        <header>
            <h1>Le Moderne Pro</h1>
            <button onclick="location.reload()" style="background: none; border: 1px solid var(--bordure); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600;">Déconnexion</button>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('articles', this)">Articles</button>
            <button class="tab-btn" onclick="switchTab('themes', this)">Rubriques</button>
            <button class="tab-btn" onclick="switchTab('offres', this)">Offres</button>
            <button class="tab-btn" onclick="switchTab('lecteurs', this)">Lecteurs (CRM)</button>
            <button class="tab-btn" onclick="switchTab('messages', this)">Messages 📥</button>
            <button class="tab-btn" onclick="switchTab('parametres', this)" style="color: #ef4444;">Paramètres</button>
        </div>

        <div class="container">
            <!-- ARTICLES -->
            <div id="section-articles" class="section active">
                <div class="input-group" style="background: #f8fafc; padding: 20px; border-radius: 8px; border: 1px dashed var(--primaire);">
                    <select id="select-article" onchange="chargerArticlePourEdition()"><option value="">✨ Rédiger un nouvel article</option></select>
                </div>
                
                <div class="grid-2">
                    <div class="input-group"><label>Titre de l'article</label><input type="text" id="titre-article"></div>
                    <div class="input-group"><label>Rubrique</label><select id="categorie-article"><option value="">-- Choisir --</option></select></div>
                </div>
                
                <div class="input-group">
                    <label>URL de l'image de couverture</label>
                    <input type="text" id="image-article" placeholder="https://..." oninput="updateImagePreview()">
                </div>

                <div class="grid-2" style="background:#f8fafc; padding:20px; border-radius:12px; border:1px solid var(--bordure);">
                    <div>
                        <label style="font-size:0.9rem; margin-bottom:5px;">↕️ Cadrage vertical : <span id="pos-val">50%</span></label>
                        <input type="range" id="image-position" min="0" max="100" value="50" style="width:100%; cursor:pointer;" oninput="updateImagePreview()">
                    </div>
                    <div>
                        <label style="font-size:0.9rem; margin-bottom:5px;">🔍 Zoom (Dézoom possible) : <span id="scale-val">x1.0</span></label>
                        <input type="range" id="image-scale" min="0.2" max="3" step="0.1" value="1" style="width:100%; cursor:pointer;" oninput="updateImagePreview()">
                    </div>
                    <div style="grid-column: 1 / -1; display:flex; align-items:center; gap:10px; margin-top:10px; padding-top:15px; border-top:1px dashed var(--bordure);">
                        <input type="checkbox" id="est-a-la-une" style="width:20px; height:20px; cursor:pointer;">
                        <label style="margin:0; cursor:pointer; font-weight:700; color:#b45309;">🌟 Mettre "À la une"</label>
                    </div>
                </div>

                <div id="preview-box" class="preview-crop-box">
                    <img id="preview-img" class="preview-crop-img" src="" alt="Aperçu">
                </div>

                <div class="box-info" style="margin-top: 25px;"><strong>Paywall intelligent :</strong> Si la case "Premium" est remplie, l'article sera bloqué pour les non-abonnés.</div>
                
                <div class="input-group"><label style="color: #059669;">1. Accroche (Gratuit)</label><div id="quill-public" class="editor-container"></div></div>
                <div class="input-group"><label style="color: #e11d48;">2. Suite de l'article (Premium 🔒)</label><div id="quill-premium" class="editor-container"></div></div>
                
                <div style="display: flex; gap: 15px; margin-top: 20px;">
                    <button class="btn-primaire" id="btn-save-article" onclick="sauvegarderArticle()" style="flex: 1; font-size: 1.1rem; padding: 15px;">Publier l'article</button>
                    <button class="btn-danger" id="btn-delete-article" onclick="supprimerArticle()" style="display: none; padding: 15px; border-radius: 8px; font-size: 1.1rem;">Supprimer</button>
                </div>
            </div>

            <!-- THEMES -->
            <div id="section-themes" class="section">
                <h2>Gestion des Rubriques</h2>
                <div class="grid-2" style="align-items: end; margin-bottom: 40px;">
                    <div class="input-group" style="margin-bottom: 0;"><label>Nom de la rubrique</label><input type="text" id="nom-theme"></div>
                    <button class="btn-primaire" onclick="creerTheme()">Créer</button>
                </div>
                <div id="liste-themes-admin"></div>
            </div>

            <!-- OFFRES -->
            <div id="section-offres" class="section">
                <div class="input-group" style="background: #f8fafc; padding: 20px; border-radius: 8px; border: 1px dashed var(--secondaire);">
                    <select id="select-offre" onchange="chargerOffrePourEdition()"><option value="">✨ Créer une NOUVELLE offre</option></select>
                </div>
                <div class="grid-2">
                    <div class="input-group"><label>Nom de l'offre</label><input type="text" id="nom-offre"></div>
                    <div class="input-group"><label>Prix (€)</label><input type="number" id="prix-offre" step="0.01"></div>
                </div>
                <div class="grid-2">
                    <div class="input-group"><label>Lien Stripe</label><input type="text" id="lien-stripe"></div>
                    <div class="input-group"><label>Articles à offrir / mois</label><input type="number" id="partages-offre"></div>
                </div>
                <div class="input-group"><label>Avantages (1 par ligne)</label><textarea id="avantages-offre" rows="4"></textarea></div>
                <button class="btn-primaire" id="btn-save-offre" onclick="sauvegarderOffre()" style="width: 100%; font-size: 1.1rem; padding: 15px;">Enregistrer l'offre</button>
            </div>

            <!-- CRM LECTEURS -->
            <div id="section-lecteurs" class="section">
                <h2>CRM des Lecteurs</h2>
                <div class="input-group" style="display:flex; gap:10px; margin-bottom: 25px;">
                    <input type="email" id="recherche-email" placeholder="Rechercher par email..." style="flex:1;">
                    <button class="btn-primaire" onclick="rechercherLecteur()" style="white-space:nowrap;">Chercher</button>
                </div>
                <div id="fiche-lecteur" style="display:none; background:#f8fafc; border:1px solid #cbd5e1; padding:20px; border-radius:12px; margin-bottom:25px;"></div>
                <div id="actions-lecteur" style="display:none; border-top:1px dashed #cbd5e1; padding-top:20px;">
                    
                    <button id="btn-suspendre" class="btn-danger" style="width: 100%; padding: 15px; margin-bottom: 20px; font-size: 1rem;" onclick="basculerSuspension()">Suspendre le compte</button>

                    <h3 style="margin-top:0;">Modification manuelle</h3>
                    <div class="input-group">
                        <label>Attribuer une nouvelle offre (ou laisser vide)</label>
                        <select id="offre-attribuee"><option value="">-- Ne pas changer l'offre --</option></select>
                    </div>
                    <div class="grid-2">
                        <div class="input-group"><label>Action</label><select id="action-lecteur"><option value="ajouter">Ajouter des jours</option><option value="retirer">Retirer des jours</option></select></div>
                        <div class="input-group"><label>Nombre de jours</label><input type="number" id="jours-lecteur" value="30"></div>
                    </div>
                    <button class="btn-primaire" onclick="gererAbonnement()" style="width: 100%; padding: 15px;">Appliquer les modifications d'abonnement</button>
                </div>
            </div>

            <!-- MESSAGES -->
            <div id="section-messages" class="section">
                <h2>Boîte de réception</h2>
                <div id="liste-messages"></div>
            </div>

            <!-- PARAMETRES -->
            <div id="section-parametres" class="section">
                <h2>Paramètres</h2>
                <div class="input-group"><label>Bandeau "Flash Info"</label><textarea id="texte-flash" rows="3"></textarea><button class="btn-primaire" onclick="sauvegarderFlash()" style="margin-top:10px;">Enregistrer</button></div>
                <h2 style="color: #ef4444; margin-top: 50px;">Zone de Danger</h2>
                <div style="background: #fee2e2; border: 1px solid #fca5a5; padding: 30px; border-radius: 12px; text-align: center;">
                    <h3 style="margin-top: 0; color: #b91c1c;">Mode Maintenance</h3>
                    <button id="btn-maintenance" class="btn-danger" style="font-size: 1.1rem; padding: 12px 25px;" onclick="toggleMaintenance()">Chargement...</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script>
        const supabaseUrl = 'https://zbuwjvbcxqxtwughuadf.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpidXdqdmJjeHF4dHd1Z2h1YWRmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyMDc2ODAsImV4cCI6MjEwMjc4MzY4MH0.lO0FizbO5jnRvRjrMERCKe6cBFFN_ttBMlRAGXtlHyo';
        const db = supabase.createClient(supabaseUrl, supabaseKey);

        let listeArticles = [], listeCategories = [], listeOffres = [];
        let articleEditionId = null, offreEditionId = null, enMaintenance = false, lecteurEnCours = null;

        const quillOptions = { theme: 'snow', modules: { toolbar: [ [{ 'header': [1, 2, 3, false] }], ['bold', 'italic', 'blockquote'], ['link', 'image'], [{'list': 'bullet'}], ['clean'] ] } };
        var quillPublic = new Quill('#quill-public', { ...quillOptions, placeholder: 'Introduction visible par tous...' });
        var quillPremium = new Quill('#quill-premium', { ...quillOptions, placeholder: 'Contenu premium exclusif...' });

        async function checkPassword() {
            if (document.getElementById('password-input').value === 'ided13') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('editor-dashboard').style.display = 'block';
                await chargerToutesLesDonnees();
            } else { alert('Mot de passe incorrect'); }
        }

        function switchTab(sectionId, element) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('section-' + sectionId).classList.add('active'); element.classList.add('active');
        }

        function updateImagePreview() {
            const url = document.getElementById('image-article').value.trim();
            const pos = document.getElementById('image-position').value;
            const scale = document.getElementById('image-scale').value;
            
            document.getElementById('pos-val').innerText = pos + '%';
            document.getElementById('scale-val').innerText = 'x' + scale;
            
            const box = document.getElementById('preview-box');
            const img = document.getElementById('preview-img');
            
            if(url) {
                img.src = url;
                img.style.objectPosition = `center ${pos}%`;
                img.style.transform = `scale(${scale})`;
                box.style.display = 'block';
            } else {
                box.style.display = 'none';
            }
        }

        async function chargerToutesLesDonnees() {
            const { data: cats } = await db.from('categories').select('*').order('nom');
            listeCategories = cats || [];
            const selectCat = document.getElementById('categorie-article');
            const conteneurThemes = document.getElementById('liste-themes-admin');
            selectCat.innerHTML = '<option value="">-- Choisir --</option>'; conteneurThemes.innerHTML = '';
            listeCategories.forEach(c => { selectCat.innerHTML += `<option value="${c.id}">${c.nom}</option>`; conteneurThemes.innerHTML += `<div class="list-item"><b>${c.nom}</b><button class="btn-danger" onclick="supprimerTheme('${c.id}')">Supprimer</button></div>`; });

            const { data: arts } = await db.from('articles').select('*').order('date_publication', { ascending: false });
            listeArticles = arts || [];
            const selectArt = document.getElementById('select-article');
            selectArt.innerHTML = '<option value="">✨ Rédiger un nouvel article</option>';
            listeArticles.forEach(a => selectArt.innerHTML += `<option value="${a.id}">📝 Éditer : ${a.titre}</option>`);

            const { data: offs } = await db.from('offres').select('*').order('prix_euros');
            listeOffres = offs || [];
            const selectOff = document.getElementById('select-offre');
            const selectOffreLecteur = document.getElementById('offre-attribuee');
            selectOff.innerHTML = '<option value="">✨ Créer une NOUVELLE offre</option>';
            selectOffreLecteur.innerHTML = '<option value="">-- Ne pas changer l\'offre --</option>';
            listeOffres.forEach(o => { 
                selectOff.innerHTML += `<option value="${o.id}">⚙️ Éditer : ${o.nom}</option>`;
                selectOffreLecteur.innerHTML += `<option value="${o.id}">${o.nom} (${o.prix_euros}€)</option>`;
            });

            const { data: settings } = await db.from('site_settings').select('*').eq('id', 1).single();
            if (settings) { enMaintenance = settings.en_maintenance; document.getElementById('texte-flash').value = settings.flash_texte || ''; actualiserBoutonMaintenance(); }
            
            chargerMessages();
        }

        function chargerArticlePourEdition() {
            articleEditionId = document.getElementById('select-article').value;
            if (!articleEditionId) {
                document.getElementById('titre-article').value = ''; 
                document.getElementById('image-article').value = ''; 
                document.getElementById('image-position').value = '50';
                document.getElementById('image-scale').value = '1';
                document.getElementById('categorie-article').value = ''; 
                document.getElementById('est-a-la-une').checked = false; 
                quillPublic.root.innerHTML = ''; quillPremium.root.innerHTML = ''; 
                document.getElementById('btn-save-article').innerText = "Publier l'article"; 
                document.getElementById('btn-delete-article').style.display = 'none';
            } else {
                const art = listeArticles.find(a => a.id.toString() === articleEditionId.toString()); 
                document.getElementById('titre-article').value = art.titre; 
                document.getElementById('image-article').value = art.image_url || ''; 
                document.getElementById('image-position').value = art.image_position ? parseInt(art.image_position) : '50';
                document.getElementById('image-scale').value = art.image_scale || '1';
                document.getElementById('categorie-article').value = art.categorie_id || ''; 
                document.getElementById('est-a-la-une').checked = art.est_a_la_une || false; 
                quillPublic.root.innerHTML = art.contenu_public || ''; 
                quillPremium.root.innerHTML = art.contenu_premium || ''; 
                document.getElementById('btn-save-article').innerText = "Enregistrer les modifs"; 
                document.getElementById('btn-delete-article').style.display = 'block';
            }
            updateImagePreview();
        }

        async function sauvegarderArticle() { 
            const posVal = document.getElementById('image-position').value + '%';
            const scaleVal = document.getElementById('image-scale').value;
            
            const payload = { 
                titre: document.getElementById('titre-article').value.trim(), 
                image_url: document.getElementById('image-article').value.trim(), 
                image_position: posVal,
                image_scale: scaleVal,
                categorie_id: document.getElementById('categorie-article').value || null, 
                est_a_la_une: document.getElementById('est-a-la-une').checked, 
                contenu_public: quillPublic.root.innerHTML === '<p><br></p>' ? '' : quillPublic.root.innerHTML, 
                contenu_premium: quillPremium.root.innerHTML === '<p><br></p>' ? null : quillPremium.root.innerHTML 
            }; 
            payload.reserve_abonnes = payload.contenu_premium !== null && payload.contenu_premium !== ''; 
            
            if(!payload.titre) return alert("Titre requis."); 
            const req = articleEditionId ? db.from('articles').update(payload).eq('id', articleEditionId) : db.from('articles').insert([payload]); 
            const { error } = await req; if(error) alert("Erreur: " + error.message); else { alert("✅ Article sauvegardé !"); chargerToutesLesDonnees(); } 
        }

        async function supprimerArticle() { if(!articleEditionId || !confirm("Supprimer cet article DÉFINITIVEMENT ?")) return; const { error } = await db.from('articles').delete().eq('id', articleEditionId); if(error) alert("Erreur: " + error.message); else { document.getElementById('select-article').value = ''; chargerArticlePourEdition(); chargerToutesLesDonnees(); } }
        
        async function rechercherLecteur() {
            const email = document.getElementById('recherche-email').value.trim();
            if(!email) return alert("Veuillez saisir un email.");
            const { data: lecteur, error } = await db.from('lecteurs').select('*').eq('email', email).single();
            if(error || !lecteur) { alert("Lecteur introuvable."); document.getElementById('fiche-lecteur').style.display = 'none'; document.getElementById('actions-lecteur').style.display = 'none'; return; }
            
            lecteurEnCours = lecteur;
            const isAbonne = lecteur.est_abonne && new Date(lecteur.fin_abonnement) > new Date();
            const dateFin = lecteur.fin_abonnement ? new Date(lecteur.fin_abonnement).toLocaleDateString('fr-FR') : '-';
            
            let pastilleBanni = lecteur.compte_suspendu ? `<span style="background:red; color:white; padding:2px 6px; border-radius:4px; font-size:0.8rem; margin-left:10px;">Banni</span>` : '';

            document.getElementById('fiche-lecteur').innerHTML = `<h3 style="margin:0 0 10px 0;">👤 ${lecteur.prenom || 'Sans prénom'} (${lecteur.email}) ${pastilleBanni}</h3><p style="margin:0; font-size:1.1rem;">Statut : <b>${isAbonne ? lecteur.offre_nom : 'Gratuit'}</b> — Cadeaux restants : <b style="color:var(--secondaire);">${lecteur.credits_partage || 0}</b></p>`;
            document.getElementById('fiche-lecteur').style.display = 'block'; 
            document.getElementById('actions-lecteur').style.display = 'block';

            const btnSuspendre = document.getElementById('btn-suspendre');
            if(lecteur.compte_suspendu) {
                btnSuspendre.innerText = "✅ Réactiver ce compte";
                btnSuspendre.style.background = "#059669";
            } else {
                btnSuspendre.innerText = "🛑 Suspendre le compte (Bannir)";
                btnSuspendre.style.background = "#ef4444";
            }
        }

        async function basculerSuspension() {
            if(!lecteurEnCours) return;
            const nouvStatut = !lecteurEnCours.compte_suspendu;
            if(nouvStatut && !confirm("Bloquer définitivement l'accès à ce lecteur ?")) return;
            
            const { error } = await db.from('lecteurs').update({ compte_suspendu: nouvStatut }).eq('id', lecteurEnCours.id);
            if(error) alert(error.message); 
            else { alert(nouvStatut ? "✅ Compte banni avec succès." : "✅ Compte réactivé."); rechercherLecteur(); }
        }

        async function gererAbonnement() {
            if(!lecteurEnCours) return;
            const action = document.getElementById('action-lecteur').value; const jours = parseInt(document.getElementById('jours-lecteur').value); const offreId = document.getElementById('offre-attribuee').value;
            let nouvelleDate = new Date(); if (lecteurEnCours.fin_abonnement && new Date(lecteurEnCours.fin_abonnement) > nouvelleDate) { nouvelleDate = new Date(lecteurEnCours.fin_abonnement); }
            if (action === 'ajouter') nouvelleDate.setDate(nouvelleDate.getDate() + jours); else { nouvelleDate.setDate(nouvelleDate.getDate() - jours); if (nouvelleDate < new Date()) nouvelleDate = new Date(); }
            let payload = { est_abonne: nouvelleDate > new Date(), fin_abonnement: nouvelleDate.toISOString() };
            if (action === 'ajouter' && offreId !== "") { const off = listeOffres.find(o => o.id.toString() === offreId.toString()); if (off) { payload.offre_nom = off.nom; payload.offre_prix = off.prix_euros; payload.abonnement_offert = true; payload.credits_partage = off.partages_autorises || 0; } }
            const { error } = await db.from('lecteurs').update(payload).eq('id', lecteurEnCours.id);
            if(error) alert(error.message); else { alert("✅ Abonnement mis à jour."); rechercherLecteur(); }
        }

        async function chargerMessages() {
            const { data: msgs } = await db.from('messages_contact').select('*').order('date_envoi', { ascending: false });
            const conteneur = document.getElementById('liste-messages');
            conteneur.innerHTML = '';
            if(!msgs || msgs.length === 0) return;
            msgs.forEach(m => {
                const date = new Date(m.date_envoi).toLocaleString('fr-FR', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
                let repHtml = m.reponse ? `<div style="background:#eff6ff; padding:10px; border-radius:6px; margin-top:8px;"><b>Réponse envoyée :</b> ${m.reponse}</div>` : `<div style="margin-top:10px; display:flex; gap:8px;"><input type="text" id="rep-${m.id}" placeholder="Répondre..." style="flex:1; padding:8px; border-radius:4px; border:1px solid #cbd5e1;"><button class="btn-primaire" style="padding:8px 12px; font-size:0.85rem;" onclick="envoyerReponse(${m.id})">Envoyer</button></div>`;
                conteneur.innerHTML += `<div class="list-item" style="flex-direction:column; align-items:flex-start; margin-bottom:15px; padding:20px;"><div style="display:flex; justify-content:space-between; width:100%; color:#64748b; font-size:0.85rem;"><b>${m.email}</b><span>${date}</span></div><p style="margin:8px 0; font-size:1rem; color:#334155;">${m.message}</p>${repHtml}</div>`;
            });
        }

        async function envoyerReponse(id) { const rep = document.getElementById(`rep-${id}`).value.trim(); if(!rep) return; await db.from('messages_contact').update({ reponse: rep, lu_par_lecteur: false }).eq('id', id); chargerMessages(); }
        function chargerOffrePourEdition() { offreEditionId = document.getElementById('select-offre').value; if (!offreEditionId) { document.getElementById('nom-offre').value = ''; document.getElementById('prix-offre').value = ''; document.getElementById('partages-offre').value = '0'; document.getElementById('lien-stripe').value = ''; document.getElementById('avantages-offre').value = ''; document.getElementById('btn-save-offre').innerText = "Créer l'offre"; } else { const off = listeOffres.find(o => o.id.toString() === offreEditionId.toString()); document.getElementById('nom-offre').value = off.nom; document.getElementById('prix-offre').value = off.prix_euros; document.getElementById('partages-offre').value = off.partages_autorises; document.getElementById('lien-stripe').value = off.stripe_price_id; document.getElementById('avantages-offre').value = off.avantages || ''; document.getElementById('btn-save-offre').innerText = "Enregistrer l'offre"; } }
        async function sauvegarderOffre() { const payload = { nom: document.getElementById('nom-offre').value.trim(), prix_euros: parseFloat(document.getElementById('prix-offre').value), stripe_price_id: document.getElementById('lien-stripe').value.trim(), partages_autorises: parseInt(document.getElementById('partages-offre').value), avantages: document.getElementById('avantages-offre').value }; if(!payload.nom || isNaN(payload.prix_euros)) return; const req = offreEditionId ? db.from('offres').update(payload).eq('id', offreEditionId) : db.from('offres').insert([payload]); await req; chargerToutesLesDonnees(); }
        async function creerTheme() { const nom = document.getElementById('nom-theme').value.trim(); if(!nom) return; await db.from('categories').insert([{ nom }]); document.getElementById('nom-theme').value = ''; chargerToutesLesDonnees(); }
        async function supprimerTheme(id) { if(!confirm("Supprimer ?")) return; await db.from('categories').delete().eq('id', id); chargerToutesLesDonnees(); }
        async function sauvegarderFlash() { await db.from('site_settings').update({ flash_texte: document.getElementById('texte-flash').value }).eq('id', 1); alert("Flash mis à jour."); }
        function actualiserBoutonMaintenance() { const btn = document.getElementById('btn-maintenance'); if (enMaintenance) { btn.innerText = "DÉSACTIVER la maintenance"; btn.style.background = "#059669"; } else { btn.innerText = "ACTIVER la maintenance"; btn.style.background = "#dc2626"; } }
        async function toggleMaintenance() { enMaintenance = !enMaintenance; await db.from('site_settings').update({ en_maintenance: enMaintenance }).eq('id', 1); actualiserBoutonMaintenance(); alert(enMaintenance ? "Site CASSÉ." : "Site EN LIGNE."); }
    </script>
</body>
</html>
