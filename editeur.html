<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Moderne - Espace Éditeur</title>
    
    <!-- Import de Quill.js pour l'éditeur de texte -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    
    <style>
        :root {
            --bleu-profond: #0B192C; /* Bleu très moderne et sombre */
            --bleu-clair: #1A365D;
            --or: #D4AF37; /* Doré élégant */
            --fond: #F8FAFC;
            --texte: #333333;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--fond);
            margin: 0;
            padding: 0;
            color: var(--texte);
        }

        /* --- ECRAN DE CONNEXION --- */
        #login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: var(--bleu-profond);
        }

        #login-screen h1 {
            color: var(--or);
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        #password-input {
            padding: 12px 20px;
            font-size: 1rem;
            border: 2px solid var(--bleu-clair);
            border-radius: 8px;
            margin-bottom: 15px;
            outline: none;
            width: 250px;
        }

        button {
            background-color: var(--or);
            color: var(--bleu-profond);
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #F1C40F;
            transform: translateY(-2px);
        }

        /* --- TABLEAU DE BORD EDITEUR --- */
        #editor-dashboard {
            display: none; /* Caché tant que le mot de passe n'est pas bon */
        }

        header {
            background-color: var(--bleu-profond);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--or);
        }

        header h1 {
            color: var(--or);
            margin: 0;
            font-size: 1.8rem;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--bleu-profond);
        }

        .input-group input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1.1rem;
            box-sizing: border-box;
        }

        /* Personnalisation de l'éditeur Quill */
        #quill-editor {
            height: 400px;
            border-radius: 0 0 8px 8px;
        }
        .ql-toolbar {
            border-radius: 8px 8px 0 0;
            background-color: #f1f5f9;
        }

        .btn-submit {
            margin-top: 20px;
            width: 100%;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <!-- Écran de connexion -->
    <div id="login-screen">
        <h1>Le Moderne</h1>
        <input type="password" id="password-input" placeholder="Mot de passe">
        <button onclick="checkPassword()">Accéder à l'éditeur</button>
    </div>

    <!-- Tableau de bord -->
    <div id="editor-dashboard">
        <header>
            <h1>Le Moderne <span style="color: white; font-size: 1rem;">| Administration</span></h1>
            <button onclick="logout()" style="padding: 8px 15px; font-size: 0.9rem;">Déconnexion</button>
        </header>

        <div class="container">
            <h2>Créer un nouvel article</h2>
            
            <div class="input-group">
                <label>Titre de l'article</label>
                <input type="text" id="titre-article" placeholder="Ex: Les nouvelles technologies en 2026...">
            </div>

            <div class="input-group">
                <label>Contenu de l'article</label>
                <!-- C'est ici que Quill.js va s'afficher -->
                <div id="quill-editor"></div>
            </div>

            <div class="input-group" style="display: flex; align-items: center; gap: 10px;">
                <input type="checkbox" id="reserve-abonnes" style="width: 20px; height: 20px;">
                <label style="margin: 0;">Article 100% réservé aux abonnés</label>
            </div>

            <!-- Bouton fictif pour l'instant -->
            <button class="btn-submit" onclick="sauvegarderArticle()">Publier l'article</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script>
        // 1. Système de connexion simple
        function checkPassword() {
            const pwd = document.getElementById('password-input').value;
            if (pwd === 'ided13') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('editor-dashboard').style.display = 'block';
            } else {
                alert('Mot de passe incorrect');
            }
        }

        function logout() {
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('editor-dashboard').style.display = 'none';
            document.getElementById('password-input').value = '';
        }

        // 2. Initialisation de l'éditeur de texte complet (Quill)
        var quill = new Quill('#quill-editor', {
            theme: 'snow',
            placeholder: 'Rédigez votre article ici... (Utilisez la barre du haut pour ajouter le marqueur de Paywall)',
            modules: {
                toolbar: [
                    [{ 'header': [1, 2, 3, false] }],
                    ['bold', 'italic', 'underline', 'strike'],
                    [{ 'color': [] }, { 'background': [] }],
                    ['link', 'image', 'video'],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    ['clean']
                ]
            }
        });

        // 3. Fonction pour préparer l'envoi à Supabase (prochaine étape)
        function sauvegarderArticle() {
            const titre = document.getElementById('titre-article').value;
            const contenuHTML = quill.root.innerHTML;
            const toutPremium = document.getElementById('reserve-abonnes').checked;

            console.log("Titre:", titre);
            console.log("Contenu:", contenuHTML);
            console.log("100% Premium:", toutPremium);
            
            alert("Super ! Dans la prochaine étape, on connectera ce bouton pour envoyer l'article dans Supabase.");
        }
    </script>
</body>
</html>
