<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Moderne - Espace Éditeur</title>
    
    <!-- Imports -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --bleu-profond: #0B192C;
            --bleu-clair: #1A365D;
            --or: #D4AF37;
            --fond: #F8FAFC;
            --texte: #333333;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--fond);
            margin: 0;
            padding: 0;
            color: var(--texte);
        }

        /* --- ECRAN DE CONNEXION --- */
        #login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: var(--bleu-profond);
        }

        #login-screen h1 {
            color: var(--or);
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        #password-input {
            padding: 12px 20px;
            font-size: 1rem;
            border: 2px solid var(--bleu-clair);
            border-radius: 8px;
            margin-bottom: 15px;
            outline: none;
            width: 250px;
        }

        button {
            background-color: var(--or);
            color: var(--bleu-profond);
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #F1C40F;
            transform: translateY(-2px);
        }

        /* --- TABLEAU DE BORD EDITEUR --- */
        #editor-dashboard {
            display: none;
        }

        header {
            background-color: var(--bleu-profond);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--or);
        }

        header h1 {
            color: var(--or);
            margin: 0;
            font-size: 1.8rem;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--bleu-profond);
        }

        .input-group input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1.1rem;
            box-sizing: border-box;
        }

        /* Éditeur Quill */
        #quill-editor {
            height: 400px;
            border-radius: 0 0 8px 8px;
        }
        
        .ql-toolbar {
            border-radius: 8px 8px 0 0;
            background-color: #f1f5f9;
        }

        .btn-submit {
            margin-top: 20px;
            width: 100%;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <!-- Écran de connexion -->
    <div id="login-screen">
        <h1>Le Moderne</h1>
        <input type="password" id="password-input" placeholder="Mot de passe">
        <button onclick="checkPassword()">Accéder à l'éditeur</button>
    </div>

    <!-- Tableau de bord -->
    <div id="editor-dashboard">
        <header>
            <h1>Le Moderne <span style="color: white; font-size: 1rem;">| Administration</span></h1>
            <button onclick="logout()" style="padding: 8px 15px; font-size: 0.9rem;">Déconnexion</button>
        </header>

        <div class="container">
            <h2>Créer un nouvel article</h2>
            
            <div class="input-group">
                <label>Titre de l'article</label>
                <input type="text" id="titre-article" placeholder="Ex: Les nouvelles technologies en 2026...">
            </div>

            <div class="input-group">
                <label>Contenu de l'article</label>
                <div id="quill-editor"></div>
            </div>

            <div class="input-group" style="display: flex; align-items: center; gap: 10px;">
                <input type="checkbox" id="reserve-abonnes" style="width: 20px; height: 20px;">
                <label style="margin: 0;">Article 100% réservé aux abonnés</label>
            </div>

            <button class="btn-submit" onclick="sauvegarderArticle()">Publier l'article</button>
        </div>
    </div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script>
        // 1. Initialisation de Supabase (À REMPLACER PAR TES CLÉS)
        const supabaseUrl = 'TON_URL_SUPABASE';
        const supabaseKey = 'TA_CLE_ANON_SUPABASE';
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        // 2. Système de connexion
        function checkPassword() {
            const pwd = document.getElementById('password-input').value;
            if (pwd === 'ided13') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('editor-dashboard').style.display = 'block';
            } else {
                alert('Mot de passe incorrect');
            }
        }

        function logout() {
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('editor-dashboard').style.display = 'none';
            document.getElementById('password-input').value = '';
        }

        // 3. Initialisation de l'éditeur de texte
        var quill = new Quill('#quill-editor', {
            theme: 'snow',
            placeholder: 'Rédigez ici... Tapez [PAYWALL] pour définir la limite de lecture gratuite.',
            modules: {
                toolbar: [
                    [{ 'header': [1, 2, 3, false] }],
                    ['bold', 'italic', 'underline', 'strike'],
                    [{ 'color': [] }, { 'background': [] }],
                    ['link', 'image', 'video'],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    ['clean']
                ]
            }
        });

        // 4. Fonction d'envoi vers Supabase
        async function sauvegarderArticle() {
            const titre = document.getElementById('titre-article').value;
            const toutPremium = document.getElementById('reserve-abonnes').checked;
            let contenuComplet = quill.root.innerHTML;
            
            if (!titre || contenuComplet === '<p><br></p>') {
                alert("Veuillez mettre un titre et un contenu.");
                return;
            }

            let contenuPublic = contenuComplet;
            let contenuPremium = null;

            // Logique de découpage du Paywall
            const separateur = "[PAYWALL]";
            if (contenuComplet.includes(separateur)) {
                const parties = contenuComplet.split(separateur);
                contenuPublic = parties[0];
                contenuPremium = parties[1];
            } else if (toutPremium) {
                contenuPublic = "<p><i>Article réservé aux abonnés.</i></p>";
                contenuPremium = contenuComplet;
            }

            // Envoi à la base de données
            const { data, error } = await supabase
                .from('articles')
                .insert([
                    { 
                        titre: titre, 
                        contenu_public: contenuPublic, 
                        contenu_premium: contenuPremium,
                        reserve_abonnes: toutPremium
                    }
                ]);

            if (error) {
                console.error("Erreur Supabase :", error);
                alert("Erreur lors de la publication : " + error.message);
            } else {
                alert("✅ Article publié avec succès !");
                quill.root.innerHTML = '';
                document.getElementById('titre-article').value = '';
                document.getElementById('reserve-abonnes').checked = false;
            }
        }
    </script>
</body>
</html>
