<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Moderne - L'Actualité Élégante</title>
    
    <!-- Import de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --bleu-profond: #0B192C;
            --bleu-clair: #1A365D;
            --or: #D4AF37;
            --fond: #F8FAFC;
            --texte: #333333;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--fond);
            margin: 0;
            padding: 0;
            color: var(--texte);
        }

        /* --- EN-TÊTE PUBLIC --- */
        header {
            background-color: var(--bleu-profond);
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--or);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            color: var(--or);
            margin: 0;
            font-size: 2.2rem;
            letter-spacing: 1px;
        }

        .auth-buttons button {
            background: transparent;
            color: white;
            border: 2px solid var(--or);
            padding: 10px 20px;
            margin-left: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .auth-buttons button.btn-abonnement {
            background-color: var(--or);
            color: var(--bleu-profond);
        }

        .auth-buttons button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(212, 175, 55, 0.3);
        }

        /* --- MODALE D'AUTHENTIFICATION --- */
        #auth-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 25, 44, 0.8);
            z-index: 200;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 1.5rem;
            cursor: pointer;
            color: #888;
        }

        .modal-content h2 {
            color: var(--bleu-profond);
            margin-top: 0;
        }

        .modal-content input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        .modal-content button {
            width: 100%;
            background-color: var(--bleu-profond);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .modal-content button.btn-alt {
            background-color: transparent;
            color: var(--bleu-clair);
            border: 1px solid var(--bleu-clair);
        }

        /* --- CONTENEUR DES ARTICLES --- */
        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .article-card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 40px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .article-titre {
            color: var(--bleu-profond);
            font-size: 2rem;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .article-date {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 25px;
            font-style: italic;
        }

        .article-contenu {
            line-height: 1.8;
            font-size: 1.1rem;
        }

        /* --- EFFET PAYWALL --- */
        .paywall-container {
            position: relative;
        }

        .texte-estompe {
            -webkit-mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
            mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
            padding-bottom: 40px;
        }

        .paywall-banner {
            background: linear-gradient(135deg, var(--bleu-profond), var(--bleu-clair));
            color: white;
            text-align: center;
            padding: 40px 20px;
            border-radius: 12px;
            margin-top: -30px;
            position: relative;
            z-index: 10;
            border: 2px solid var(--or);
        }

        .paywall-banner h3 { color: var(--or); margin-top: 0; }
        
        .paywall-banner button {
            background-color: var(--or);
            color: var(--bleu-profond);
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>Le Moderne</h1>
        <div class="auth-buttons" id="zone-boutons-header">
            <!-- Injecté via JS selon la connexion -->
            <button onclick="ouvrirModale()">Se connecter</button>
            <button class="btn-abonnement" onclick="afficherOffres()">S'abonner</button>
        </div>
    </header>

    <!-- Modale d'inscription / connexion -->
    <div id="auth-modal">
        <div class="modal-content">
            <span class="close-btn" onclick="fermerModale()">&times;</span>
            <h2 id="modal-titre">Connexion</h2>
            <input type="email" id="auth-email" placeholder="Votre adresse email">
            <input type="password" id="auth-password" placeholder="Mot de passe (6 car. min)">
            
            <div id="form-login">
                <button onclick="seConnecter()">Me connecter</button>
                <button class="btn-alt" onclick="basculerModeAuth('inscription')">Créer un compte lecteur</button>
            </div>
            
            <div id="form-register" style="display: none;">
                <button onclick="sInscrire()">Créer mon compte</button>
                <button class="btn-alt" onclick="basculerModeAuth('connexion')">J'ai déjà un compte</button>
            </div>
        </div>
    </div>

    <div class="container" id="flux-articles">
        <p style="text-align: center; color: #888;">Chargement de l'actualité...</p>
    </div>

    <script>
        // 1. Initialisation Supabase (À REMPLACER PAR TES CLÉS)
        const supabaseUrl = 'TON_URL_SUPABASE';
        const supabaseKey = 'TA_CLE_ANON_SUPABASE';
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let lecteurActuel = null;
        let estAbonne = false;

        // 2. Vérification de la session au lancement
        async function verifierSession() {
            const { data: { session } } = await supabase.auth.getSession();
            
            if (session) {
                lecteurActuel = session.user;
                // Récupérer le statut d'abonnement dans la table "lecteurs"
                const { data: profil } = await supabase
                    .from('lecteurs')
                    .select('est_abonne')
                    .eq('id', lecteurActuel.id)
                    .single();
                
                if (profil && profil.est_abonne) {
                    estAbonne = true;
                }
                
                // Mettre à jour les boutons du header
                document.getElementById('zone-boutons-header').innerHTML = `
                    <span style="color: white; margin-right: 15px;">👤 Bonjour !</span>
                    ${!estAbonne ? `<button class="btn-abonnement" onclick="afficherOffres()">S'abonner</button>` : `<span style="color: var(--or); font-weight: bold; margin-right: 15px;">✨ Membre Premium</span>`}
                    <button onclick="seDeconnecter()">Déconnexion</button>
                `;
            } else {
                lecteurActuel = null;
                estAbonne = false;
                document.getElementById('zone-boutons-header').innerHTML = `
                    <button onclick="ouvrirModale()">Se connecter</button>
                    <button class="btn-abonnement" onclick="afficherOffres()">S'abonner</button>
                `;
            }

            // Charger les articles avec les bons droits
            chargerArticles();
        }

        // 3. Authentification Supabase
        async function sInscrire() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;

            const { data, error } = await supabase.auth.signUp({ email, password });
            
            if (error) {
                alert("Erreur d'inscription : " + error.message);
            } else {
                // Créer l'entrée dans la table lecteurs liée à cet utilisateur
                if (data.user) {
                    await supabase.from('lecteurs').insert([{ id: data.user.id, email: email }]);
                }
                alert("✅ Compte créé avec succès !");
                fermerModale();
                verifierSession();
            }
        }

        async function seConnecter() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;

            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                alert("Erreur de connexion : " + error.message);
            } else {
                fermerModale();
                verifierSession();
            }
        }

        async function seDeconnecter() {
            await supabase.auth.signOut();
            verifierSession();
        }

        // 4. Charger les articles (Gestion du Paywall)
        async function chargerArticles() {
            const { data: articles, error } = await supabase
                .from('articles')
                .select('*')
                .order('date_publication', { ascending: false });

            const conteneur = document.getElementById('flux-articles');
            conteneur.innerHTML = ''; 

            if (error) return conteneur.innerHTML = `<p>Erreur lors du chargement.</p>`;
            if (articles.length === 0) return conteneur.innerHTML = `<p style="text-align:center;">Aucun article.</p>`;

            articles.forEach(article => {
                const dateFormatee = new Date(article.date_publication).toLocaleDateString('fr-FR', {
                    year: 'numeric', month: 'long', day: 'numeric'
                });

                let htmlArticle = `<div class="article-card">
                    <h2 class="article-titre">${article.titre}</h2>
                    <div class="article-date">Publié le ${dateFormatee}</div>`;

                // Logique de déverrouillage du Premium
                const necessiteAbonnement = article.reserve_abonnes || article.contenu_premium;

                if (necessiteAbonnement && !estAbonne) {
                    // Affichage bloqué
                    htmlArticle += `
                        <div class="paywall-container">
                            <div class="article-contenu texte-estompe">
                                ${article.contenu_public}
                            </div>
                            <div class="paywall-banner">
                                <h3>Cet article est réservé aux abonnés</h3>
                                <p>Rejoignez <i>Le Moderne</i> pour débloquer la suite.</p>
                                <button onclick="afficherOffres()">Découvrir nos offres</button>
                            </div>
                        </div>
                    `;
                } else {
                    // Affichage 100% débloqué (Lecteur Premium ou article gratuit)
                    htmlArticle += `
                        <div class="article-contenu">
                            ${article.contenu_public}
                            ${article.contenu_premium ? article.contenu_premium : ''}
                        </div>
                    `;
                }

                htmlArticle += `</div>`;
                conteneur.innerHTML += htmlArticle;
            });
        }

        // 5. Gestion de l'interface modale
        function ouvrirModale() { document.getElementById('auth-modal').style.display = 'flex'; }
        function fermerModale() { document.getElementById('auth-modal').style.display = 'none'; }
        function basculerModeAuth(mode) {
            if (mode === 'inscription') {
                document.getElementById('modal-titre').innerText = "Créer un compte";
                document.getElementById('form-login').style.display = 'none';
                document.getElementById('form-register').style.display = 'block';
            } else {
                document.getElementById('modal-titre').innerText = "Connexion";
                document.getElementById('form-login').style.display = 'block';
                document.getElementById('form-register').style.display = 'none';
            }
        }

        function afficherOffres() {
            alert("Redirection vers la page d'abonnement Stripe en préparation !");
        }

        // Lancement initial
        verifierSession();
    </script>
</body>
</html>
