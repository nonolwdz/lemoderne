<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Moderne - L'Actualité Élégante</title>
    
    <!-- Polices Google (Style Journal et Moderne) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Import de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root { 
            --bleu-profond: #0f172a; 
            --bleu-clair: #1e293b; 
            --or: #d97706; 
            --fond: #f8fafc; 
            --texte: #334155;
            --texte-clair: #64748b;
        }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--fond); 
            margin: 0; padding: 0; 
            color: var(--texte);
            line-height: 1.6;
        }

        /* En-tête Premium */
        header { 
            background: rgba(15, 23, 42, 0.95); 
            backdrop-filter: blur(10px);
            padding: 15px 50px; 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 3px solid var(--or); 
            position: sticky; top: 0; z-index: 100; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        header h1 { 
            font-family: 'Merriweather', serif;
            color: var(--or); 
            margin: 0; font-size: 2rem; letter-spacing: -0.5px; 
        }

        /* Boutons */
        .btn {
            background: transparent; color: white; border: 1px solid var(--or); 
            padding: 8px 16px; margin-left: 10px; border-radius: 6px; 
            cursor: pointer; font-weight: 600; font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
        }
        .btn-premium { background-color: var(--or); color: white; border: 1px solid var(--or); }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(217, 119, 6, 0.2); }
        
        /* Conteneur principal */
        .container { max-width: 720px; margin: 60px auto; padding: 0 20px; }
        
        /* Articles */
        .article-card { 
            background: white; border-radius: 12px; padding: 40px; 
            margin-bottom: 40px; 
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025);
            border-top: 4px solid var(--bleu-profond);
        }
        .article-titre { 
            font-family: 'Merriweather', serif; color: var(--bleu-profond); 
            font-size: 2.2rem; margin-top: 0; margin-bottom: 8px; line-height: 1.3;
        }
        .article-date { color: var(--texte-clair); font-size: 0.9rem; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        
        /* CORRECTION DES IMAGES DE L'ÉDITEUR */
        .article-contenu img { 
            max-width: 100% !important; 
            height: auto !important; 
            display: block; 
            margin: 25px auto; 
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .article-contenu iframe { max-width: 100%; border-radius: 8px; }
        .article-contenu { font-size: 1.15rem; color: #1e293b; line-height: 1.8; }
        .article-contenu h1, .article-contenu h2 { font-family: 'Merriweather', serif; color: var(--bleu-profond); margin-top: 2em; }
        
        /* Paywall */
        .paywall-container { position: relative; }
        .texte-estompe { -webkit-mask-image: linear-gradient(to bottom, black 20%, transparent 100%); mask-image: linear-gradient(to bottom, black 20%, transparent 100%); padding-bottom: 60px; }
        .paywall-banner { 
            background: var(--bleu-profond); color: white; text-align: center; 
            padding: 40px 30px; border-radius: 12px; margin-top: -60px; 
            position: relative; z-index: 10; border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .paywall-banner h3 { font-family: 'Merriweather', serif; color: var(--or); margin-top: 0; font-size: 1.5rem; }
        
        /* Section Partage */
        .action-partage {
            margin-top: 30px; padding-top: 20px; border-top: 1px solid #e2e8f0;
            display: flex; justify-content: space-between; align-items: center;
        }
        .btn-partage {
            background-color: #f1f5f9; color: var(--bleu-profond); border: 1px solid #cbd5e1;
            padding: 8px 16px; border-radius: 20px; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        .btn-partage:hover { background-color: var(--or); color: white; border-color: var(--or); }
        .credits-info { font-size: 0.9rem; color: var(--texte-clair); }

        /* Modales (Style épuré) */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.85); z-index: 200; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        .modal-content { background: white; padding: 40px; border-radius: 16px; width: 90%; max-width: 450px; position: relative; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); }
        .close-btn { position: absolute; top: 20px; right: 25px; font-size: 1.5rem; cursor: pointer; color: #94a3b8; transition: 0.2s; }
        .close-btn:hover { color: var(--bleu-profond); }
        
        .modal-content h2 { font-family: 'Merriweather', serif; color: var(--bleu-profond); margin-top: 0; margin-bottom: 25px; }
        .input-champ { width: 100%; padding: 14px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 1rem; font-family: 'Inter', sans-serif; }
        .input-champ:focus { outline: none; border-color: var(--or); box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.1); }
        .btn-submit { width: 100%; background-color: var(--bleu-profond); color: white; padding: 14px; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: 600; cursor: pointer; margin-bottom: 10px; transition: 0.2s; }
        .btn-submit:hover { background-color: var(--or); }
        .btn-texte { background: none; border: none; color: var(--texte-clair); text-decoration: underline; cursor: pointer; width: 100%; font-size: 0.9rem; }

        /* Grille des offres */
        .offres-modal { max-width: 900px; max-height: 90vh; overflow-y: auto; }
        .offres-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; margin-top: 30px; }
        .offre-card { border: 1px solid #e2e8f0; border-radius: 16px; padding: 30px; text-align: center; transition: 0.3s; background: #fff; }
        .offre-card:hover { border-color: var(--or); box-shadow: 0 20px 25px -5px rgba(217, 119, 6, 0.1); transform: translateY(-4px); }
        .offre-card h3 { font-family: 'Merriweather', serif; color: var(--bleu-profond); font-size: 1.4rem; margin-top: 0; }
        .offre-prix { font-size: 2.5rem; color: var(--or); font-weight: 700; margin: 15px 0; }
        .offre-avantages { list-style: none; padding: 0; margin-bottom: 30px; text-align: left; font-size: 0.95rem; }
        .offre-avantages li { margin-bottom: 12px; padding-left: 28px; position: relative; color: var(--texte); }
        .offre-avantages li::before { content: '✓'; position: absolute; left: 0; color: var(--or); font-weight: bold; font-size: 1.1rem; }
    </style>
</head>
<body>

    <header>
        <h1>Le Moderne</h1>
        <div id="zone-boutons-header"></div>
    </header>

    <!-- Modale Connexion / Inscription -->
    <div id="auth-modal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-btn" onclick="fermerModaleAuth()">&times;</span>
            <h2 id="modal-titre">Connexion</h2>
            <input type="email" id="auth-email" class="input-champ" placeholder="Votre adresse email">
            <input type="password" id="auth-password" class="input-champ" placeholder="Mot de passe (6 car. min)">
            <div id="form-login">
                <button class="btn-submit" onclick="seConnecter()">Me connecter</button>
                <button class="btn-texte" onclick="basculerModeAuth('inscription')">Je n'ai pas de compte</button>
            </div>
            <div id="form-register" style="display: none;">
                <button class="btn-submit" onclick="sInscrire()">Créer mon compte</button>
                <button class="btn-texte" onclick="basculerModeAuth('connexion')">J'ai déjà un compte</button>
            </div>
        </div>
    </div>

    <!-- Modale Offres -->
    <div id="offres-modal" class="modal-overlay">
        <div class="modal-content offres-modal">
            <span class="close-btn" onclick="fermerModaleOffres()">&times;</span>
            <h2 style="text-align: center; font-size: 2.2rem;">Rejoignez Le Moderne</h2>
            <p style="text-align: center; color: var(--texte-clair); margin-bottom: 40px;">Soutenez l'indépendance de la presse et débloquez votre confort de lecture.</p>
            <div class="offres-grid" id="liste-offres"></div>
        </div>
    </div>

    <!-- Modale Partage -->
    <div id="partage-modal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-btn" onclick="fermerModalePartage()">&times;</span>
            <h2>Offrir cet article</h2>
            <p style="color: var(--texte-clair); margin-bottom: 20px;">Entrez l'email d'un proche pour lui débloquer cet article premium. (Il recevra un email si son compte existe).</p>
            <input type="email" id="partage-email" class="input-champ" placeholder="Email de votre ami">
            <button class="btn-submit" onclick="validerPartage()">Partager l'article</button>
        </div>
    </div>

    <div class="container" id="flux-articles"></div>

    <script>
        const supabaseUrl = 'https://zbuwjvbcxqxtwughuadf.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpidXdqdmJjeHF4dHd1Z2h1YWRmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyMDc2ODAsImV4cCI6MjEwMjc4MzY4MH0.lO0FizbO5jnRvRjrMERCKe6cBFFN_ttBMlRAGXtlHyo';
        const db = supabase.createClient(supabaseUrl, supabaseKey);

        let lecteurActuel = null;
        let estAbonne = false;
        let creditsPartage = 0;
        let articleEnCoursDePartage = null;

        async function verifierSession() {
            const { data: { session } } = await db.auth.getSession();
            if (session) {
                lecteurActuel = session.user;
                // On récupère aussi les crédits de partage
                const { data: profil } = await db.from('lecteurs').select('est_abonne, fin_abonnement, credits_partage').eq('id', lecteurActuel.id).single();
                
                if (profil && profil.est_abonne && new Date(profil.fin_abonnement) > new Date()) {
                    estAbonne = true;
                    creditsPartage = profil.credits_partage || 0;
                } else if (profil && profil.est_abonne) {
                    await db.from('lecteurs').update({ est_abonne: false }).eq('id', lecteurActuel.id);
                    estAbonne = false;
                }
                
                document.getElementById('zone-boutons-header').innerHTML = `
                    <span style="color: white; margin-right: 15px; font-weight:600;">Mon compte</span>
                    ${!estAbonne ? `<button class="btn btn-premium" onclick="afficherOffres()">S'abonner</button>` : `<span style="color: var(--or); font-weight: 600; margin-right: 15px;">Édition Premium</span>`}
                    <button class="btn" onclick="seDeconnecter()">Déconnexion</button>
                `;
            } else {
                lecteurActuel = null; estAbonne = false; creditsPartage = 0;
                document.getElementById('zone-boutons-header').innerHTML = `<button class="btn" onclick="ouvrirModaleAuth()">Se connecter</button><button class="btn btn-premium" onclick="afficherOffres()">S'abonner</button>`;
            }
            chargerArticles();
        }

        async function sInscrire() {
            const email = document.getElementById('auth-email').value, password = document.getElementById('auth-password').value;
            const { data, error } = await db.auth.signUp({ email, password });
            if (error) alert("Erreur : " + error.message);
            else { 
                if (data.user) await db.from('lecteurs').insert([{ id: data.user.id, email: email }]); 
                alert("✅ Compte créé avec succès !"); fermerModaleAuth(); verifierSession(); 
            }
        }

        async function seConnecter() {
            const email = document.getElementById('auth-email').value, password = document.getElementById('auth-password').value;
            const { error } = await db.auth.signInWithPassword({ email, password });
            if (error) alert("Erreur de connexion."); else { fermerModaleAuth(); verifierSession(); }
        }

        async function seDeconnecter() { await db.auth.signOut(); verifierSession(); }

        async function chargerArticles() {
            const { data: articles, error } = await db.from('articles').select('*').order('date_publication', { ascending: false });
            const conteneur = document.getElementById('flux-articles'); conteneur.innerHTML = ''; 
            if (error) return conteneur.innerHTML = `<p>Erreur de chargement des articles.</p>`;
            if (articles.length === 0) return conteneur.innerHTML = `<p style="text-align:center;">Le journal est vide pour le moment.</p>`;

            articles.forEach(article => {
                const dateFormatee = new Date(article.date_publication).toLocaleDateString('fr-FR', { year: 'numeric', month: 'long', day: 'numeric' });
                let htmlArticle = `<div class="article-card"><h2 class="article-titre">${article.titre}</h2><div class="article-date">Publié le ${dateFormatee}</div>`;
                
                // Si l'article est bloqué et que le lecteur n'est PAS abonné
                if ((article.reserve_abonnes || article.contenu_premium) && !estAbonne) {
                    htmlArticle += `
                    <div class="paywall-container">
                        <div class="article-contenu texte-estompe">${article.contenu_public}</div>
                        <div class="paywall-banner">
                            <h3>Cet article est réservé aux abonnés</h3>
                            <p style="color: #cbd5e1; margin-bottom: 20px;">Rejoignez nos lecteurs pour lire la suite.</p>
                            <button class="btn btn-premium" style="padding: 12px 30px; font-size:1.1rem;" onclick="afficherOffres()">Découvrir nos offres</button>
                        </div>
                    </div>`;
                } else {
                    // Affichage complet
                    htmlArticle += `<div class="article-contenu">${article.contenu_public} ${article.contenu_premium ? article.contenu_premium : ''}</div>`;
                    
                    // Ajout du bouton de partage si le lecteur est un abonné
                    if (estAbonne && (article.reserve_abonnes || article.contenu_premium)) {
                        const boutonPartage = creditsPartage > 0 
                            ? `<button class="btn-partage" onclick="ouvrirModalePartage('${article.id}')">🎁 Offrir cet article</button>` 
                            : `<button class="btn-partage" style="opacity: 0.5; cursor: not-allowed;" disabled>🎁 Quota de partages atteint</button>`;
                        
                        htmlArticle += `
                        <div class="action-partage">
                            <span class="credits-info">Il vous reste <b>${creditsPartage} partage(s)</b> ce mois-ci.</span>
                            ${boutonPartage}
                        </div>`;
                    }
                }
                conteneur.innerHTML += htmlArticle + `</div>`;
            });
        }

        // --- GESTION DU PARTAGE ---
        function ouvrirModalePartage(articleId) {
            articleEnCoursDePartage = articleId;
            document.getElementById('partage-modal').style.display = 'flex';
        }

        function fermerModalePartage() {
            document.getElementById('partage-modal').style.display = 'none';
            document.getElementById('partage-email').value = '';
            articleEnCoursDePartage = null;
        }

        async function validerPartage() {
            const emailAmi = document.getElementById('partage-email').value;
            if(!emailAmi) return alert("Veuillez saisir une adresse email.");
            if(creditsPartage <= 0) return alert("Vous n'avez plus de crédits de partage.");

            // 1. Enregistrer le partage dans la base
            const { error: errInsert } = await db.from('partages_articles').insert([{
                article_id: articleEnCoursDePartage,
                lecteur_id: lecteurActuel.id,
                email_destinataire: emailAmi
            }]);

            if (errInsert) return alert("Erreur lors du partage : " + errInsert.message);

            // 2. Déduire le crédit du lecteur
            creditsPartage--;
            await db.from('lecteurs').update({ credits_partage: creditsPartage }).eq('id', lecteurActuel.id);

            alert(`✅ Article envoyé à ${emailAmi} ! S'il est inscrit, un email lui sera envoyé (Simulation Resend).`);
            fermerModalePartage();
            chargerArticles(); // Recharge pour mettre à jour le texte "Il vous reste X partages"
        }

        // --- OFFRES ET MODALES ---
        async function afficherOffres() {
            if (!lecteurActuel) return alert("Veuillez créer un compte gratuit pour voir les offres.") || ouvrirModaleAuth();
            document.getElementById('offres-modal').style.display = 'flex';
            const conteneur = document.getElementById('liste-offres');
            const { data: offres, error } = await db.from('offres').select('*').order('prix_euros', { ascending: true });
            
            if (error || offres.length === 0) return conteneur.innerHTML = '<p style="text-align:center;">Aucune offre disponible actuellement.</p>';
            conteneur.innerHTML = '';
            
            offres.forEach(offre => {
                const lienPaiement = `${offre.stripe_price_id}?prefilled_email=${encodeURIComponent(lecteurActuel.email)}`;
                let listeAvantages = '';
                if (offre.avantages) offre.avantages.split('\n').forEach(av => { if (av.trim() !== '') listeAvantages += `<li>${av.trim()}</li>`; });
                if (offre.partages_autorises > 0) listeAvantages += `<li><b>${offre.partages_autorises} articles</b> à offrir par mois</li>`;

                conteneur.innerHTML += `
                    <div class="offre-card">
                        <h3>${offre.nom}</h3>
                        <div class="offre-prix">${offre.prix_euros} €<span style="font-size: 1rem; color: #64748b;">/mois</span></div>
                        <ul class="offre-avantages">${listeAvantages}</ul>
                        <a href="${lienPaiement}" class="btn-submit" style="display:inline-block; text-decoration:none; box-sizing:border-box;">Choisir cette offre</a>
                    </div>`;
            });
        }

        function ouvrirModaleAuth() { document.getElementById('auth-modal').style.display = 'flex'; }
        function fermerModaleAuth() { document.getElementById('auth-modal').style.display = 'none'; }
        function fermerModaleOffres() { document.getElementById('offres-modal').style.display = 'none'; }
        function basculerModeAuth(mode) {
            document.getElementById('modal-titre').innerText = mode === 'inscription' ? "Créer un compte" : "Connexion";
            document.getElementById('form-login').style.display = mode === 'inscription' ? 'none' : 'block';
            document.getElementById('form-register').style.display = mode === 'inscription' ? 'block' : 'none';
        }

        verifierSession();
    </script>
</body>
</html>
