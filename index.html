<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Moderne | Média Indépendant</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root { 
            --fond: #f8fafc; --texte: #0f172a; --texte-clair: #64748b; 
            --accent: #4f46e5; --accent-hover: #4338ca; 
            --premium: #ec4899; --blanc: #ffffff;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-hover: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        
        body { font-family: 'Inter', sans-serif; background: var(--fond); color: var(--texte); margin: 0; padding: 0; line-height: 1.6; }
        h1, h2, h3, .titre-serif { font-family: 'Playfair Display', serif; }

        /* HEADER FLOTTANT */
        header { 
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; 
            position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #e2e8f0;
        }
        .logo { font-size: 1.8rem; font-weight: 800; color: var(--texte); text-decoration: none; cursor: pointer; }
        .logo span { color: var(--accent); }
        
        /* NAVIGATION THEMES */
        nav { display: flex; gap: 20px; overflow-x: auto; padding: 15px 5%; background: var(--blanc); border-bottom: 1px solid #e2e8f0; }
        .nav-link { color: var(--texte-clair); text-decoration: none; font-weight: 600; font-size: 0.95rem; padding: 5px 10px; border-radius: 6px; cursor: pointer; transition: 0.2s; white-space: nowrap; }
        .nav-link:hover, .nav-link.active { color: var(--accent); background: #eff6ff; }

        /* BOUTONS */
        .btn { padding: 10px 20px; border-radius: 50px; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: 0.2s; border: none; font-family: 'Inter'; }
        .btn-outline { background: transparent; color: var(--texte); border: 1px solid #cbd5e1; }
        .btn-outline:hover { border-color: var(--texte); }
        .btn-primaire { background: var(--accent); color: white; box-shadow: 0 4px 14px 0 rgba(79, 70, 229, 0.39); }
        .btn-primaire:hover { background: var(--accent-hover); transform: translateY(-1px); }
        .btn-premium { background: linear-gradient(135deg, var(--premium), #f43f5e); color: white; }

        /* VUE GRILLE (ACCUEIL) */
        #vue-grille { max-width: 1200px; margin: 40px auto; padding: 0 5%; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; }
        
        .card { 
            background: var(--blanc); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); 
            cursor: pointer; transition: 0.3s; display: flex; flex-direction: column;
        }
        .card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }
        .card-img { width: 100%; height: 200px; object-fit: cover; background: #e2e8f0; }
        .card-content { padding: 25px; flex-grow: 1; display: flex; flex-direction: column; }
        .card-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .card-categorie { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: var(--accent); letter-spacing: 0.5px; }
        .card-premium-badge { background: #fdf2f8; color: var(--premium); font-size: 0.75rem; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
        .card-titre { font-size: 1.4rem; margin: 0 0 15px 0; line-height: 1.3; }
        .card-date { font-size: 0.85rem; color: var(--texte-clair); margin-top: auto; }

        /* VUE ARTICLE UNIQUE (PLEIN ECRAN) */
        #vue-article { display: none; max-width: 800px; margin: 0 auto; padding: 40px 5%; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .btn-retour { display: inline-flex; align-items: center; color: var(--texte-clair); text-decoration: none; font-weight: 600; cursor: pointer; margin-bottom: 30px; border: none; background: none; font-size: 1rem; }
        .btn-retour:hover { color: var(--accent); }
        
        .art-header-img { width: 100%; height: 400px; object-fit: cover; border-radius: 20px; margin-bottom: 30px; box-shadow: var(--shadow); }
        .art-titre { font-size: 3rem; line-height: 1.1; margin-bottom: 20px; color: var(--texte); }
        .art-meta { display: flex; gap: 15px; color: var(--texte-clair); margin-bottom: 40px; font-size: 0.95rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 20px; }
        
        .art-contenu { font-size: 1.15rem; color: #334155; line-height: 1.8; }
        .art-contenu img { max-width: 100%; border-radius: 12px; margin: 30px 0; }
        .art-contenu h2 { font-size: 1.8rem; margin-top: 40px; color: var(--texte); }

        /* PAYWALL DANS L'ARTICLE */
        .paywall-box { 
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,1) 30%); 
            padding-top: 100px; margin-top: -80px; position: relative; text-align: center; padding-bottom: 50px;
        }
        .paywall-card { background: var(--blanc); border: 1px solid #e2e8f0; border-radius: 16px; padding: 40px; box-shadow: var(--shadow-hover); max-width: 500px; margin: 0 auto; }
        
        /* CADEAU & PARTAGE */
        .cadeau-banner { background: #fdf2f8; border: 1px solid #fbcfe8; color: #be185d; padding: 15px 20px; border-radius: 12px; margin-bottom: 30px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .share-box { background: var(--fond); border: 1px solid #e2e8f0; padding: 25px; border-radius: 16px; margin-top: 40px; display: flex; justify-content: space-between; align-items: center; }

        /* MODALES (Standardisées et propres) */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.5); z-index: 200; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        .modal-content { background: var(--blanc); padding: 40px; border-radius: 20px; width: 90%; max-width: 400px; position: relative; box-shadow: var(--shadow-hover); }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 1.5rem; cursor: pointer; color: var(--texte-clair); }
        .input-champ { width: 100%; padding: 12px 15px; border: 1px solid #cbd5e1; border-radius: 8px; margin-bottom: 15px; box-sizing: border-box; font-family: inherit; }
        
        .offres-modal { max-width: 900px; max-height: 90vh; overflow-y: auto; }
        .offres-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .offre-card { border: 2px solid #e2e8f0; border-radius: 16px; padding: 30px; display: flex; flex-direction: column; transition: 0.2s; }
        .offre-card:hover { border-color: var(--accent); }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="afficherGrille()">Le<span>Moderne</span></div>
        <div id="zone-boutons-header" style="display: flex; gap: 10px; align-items: center;"></div>
    </header>

    <nav id="nav-themes">
        <a class="nav-link active" onclick="filtrerArticles(null)">À la une</a>
        <!-- Thèmes injectés ici -->
    </nav>

    <!-- VUE 1 : LA GRILLE -->
    <div id="vue-grille"></div>

    <!-- VUE 2 : LECTURE D'UN ARTICLE -->
    <div id="vue-article">
        <button class="btn-retour" onclick="afficherGrille()">← Retour à l'accueil</button>
        <div id="conteneur-article-complet"></div>
    </div>

    <!-- MODALES -->
    <div id="auth-modal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-btn" onclick="fermerModales()">&times;</span>
            <h2 id="modal-titre" class="titre-serif">Connexion</h2>
            <input type="email" id="auth-email" class="input-champ" placeholder="Email">
            <input type="password" id="auth-password" class="input-champ" placeholder="Mot de passe">
            <div id="form-login">
                <button class="btn btn-primaire" style="width: 100%; margin-bottom: 10px;" onclick="seConnecter()">Se connecter</button>
                <a style="display:block; text-align:center; color:var(--accent); font-size:0.9rem; cursor:pointer; font-weight:600;" onclick="basculerModeAuth('inscription')">Créer un compte gratuit</a>
            </div>
            <div id="form-register" style="display: none;">
                <button class="btn btn-primaire" style="width: 100%; margin-bottom: 10px;" onclick="sInscrire()">S'inscrire</button>
                <a style="display:block; text-align:center; color:var(--accent); font-size:0.9rem; cursor:pointer; font-weight:600;" onclick="basculerModeAuth('connexion')">J'ai déjà un compte</a>
            </div>
        </div>
    </div>

    <div id="offres-modal" class="modal-overlay">
        <div class="modal-content offres-modal">
            <span class="close-btn" onclick="fermerModales()">&times;</span>
            <h2 class="titre-serif" style="font-size: 2rem; text-align: center;">Édition Premium</h2>
            <div class="offres-grid" id="liste-offres"></div>
        </div>
    </div>

    <div id="partage-modal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-btn" onclick="fermerModales()">&times;</span>
            <h2 class="titre-serif">Offrir l'article</h2>
            <p style="color: var(--texte-clair); font-size: 0.9rem;">Saisissez l'email d'un proche. Il pourra lire cet article instantanément.</p>
            <input type="email" id="partage-email" class="input-champ" placeholder="email@ami.com">
            <button class="btn btn-primaire" style="width: 100%;" onclick="validerPartage()">Confirmer le cadeau</button>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://zbuwjvbcxqxtwughuadf.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpidXdqdmJjeHF4dHd1Z2h1YWRmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyMDc2ODAsImV4cCI6MjEwMjc4MzY4MH0.lO0FizbO5jnRvRjrMERCKe6cBFFN_ttBMlRAGXtlHyo';
        const db = supabase.createClient(supabaseUrl, supabaseKey);

        let lecteurActuel = null, estAbonne = false, creditsPartage = 0, articlesOfferts = [];
        let tousLesArticles = [], toutesLesCategories = [];
        let articleActifId = null;

        async function initialiserSite() {
            await verifierSession();
            await chargerDonnees();
        }

        async function verifierSession() {
            const { data: { session } } = await db.auth.getSession();
            if (session) {
                lecteurActuel = session.user;
                const { data: profil } = await db.from('lecteurs').select('est_abonne, fin_abonnement, credits_partage').eq('id', lecteurActuel.id).single();
                
                if (profil && profil.est_abonne && new Date(profil.fin_abonnement) > new Date()) {
                    estAbonne = true; creditsPartage = profil.credits_partage || 0;
                } else if (profil && profil.est_abonne) {
                    await db.from('lecteurs').update({ est_abonne: false }).eq('id', lecteurActuel.id);
                    estAbonne = false;
                }

                const { data: partages } = await db.from('partages_articles').select('article_id').eq('email_destinataire', lecteurActuel.email);
                if (partages) articlesOfferts = partages.map(p => p.article_id);
                
                document.getElementById('zone-boutons-header').innerHTML = `
                    <span style="font-weight:600; color:var(--texte-clair);">👤 ${lecteurActuel.email.split('@')[0]}</span>
                    ${!estAbonne ? `<button class="btn btn-premium" onclick="ouvrirOffres()">S'abonner</button>` : `<span style="color:var(--premium); font-weight:800; font-size:0.8rem; background:#fdf2f8; padding:5px 10px; border-radius:4px;">PREMIUM</span>`}
                    <button class="btn btn-outline" style="padding:6px 12px;" onclick="seDeconnecter()">Quitter</button>
                `;
            } else {
                lecteurActuel = null; estAbonne = false; creditsPartage = 0; articlesOfferts = [];
                document.getElementById('zone-boutons-header').innerHTML = `
                    <button class="btn btn-outline" onclick="ouvrirAuth()">Connexion</button>
                    <button class="btn btn-primaire" onclick="ouvrirOffres()">S'abonner</button>
                `;
            }
        }

        async function chargerDonnees() {
            // Catégories
            const { data: cats } = await db.from('categories').select('*').order('nom');
            toutesLesCategories = cats || [];
            const nav = document.getElementById('nav-themes');
            toutesLesCategories.forEach(c => {
                nav.innerHTML += `<a class="nav-link" onclick="filtrerArticles('${c.id}', this)">${c.nom}</a>`;
            });

            // Articles
            const { data: arts } = await db.from('articles').select('*').order('date_publication', { ascending: false });
            tousLesArticles = arts || [];
            
            afficherGrille(); // Construit la grille avec tous les articles par défaut
        }

        // --- GESTION DES VUES ---
        function afficherGrille() {
            document.getElementById('vue-article').style.display = 'none';
            document.getElementById('vue-grille').style.display = 'grid';
            filtrerArticles(null, document.querySelector('.nav-link')); // Reset filtre
        }

        function filtrerArticles(catId, elementNav = null) {
            if (elementNav) {
                document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
                elementNav.classList.add('active');
            }

            const conteneur = document.getElementById('vue-grille');
            conteneur.innerHTML = '';
            
            const articlesFiltres = catId ? tousLesArticles.filter(a => a.categorie_id === catId) : tousLesArticles;
            
            if(articlesFiltres.length === 0) { conteneur.innerHTML = "<p>Aucun article dans cette rubrique.</p>"; return; }

            articlesFiltres.forEach(art => {
                const catNom = toutesLesCategories.find(c => c.id === art.categorie_id)?.nom || 'Actualité';
                const date = new Date(art.date_publication).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
                const imgStr = art.image_url ? `<img src="${art.image_url}" class="card-img" alt="cover">` : `<div class="card-img"></div>`;
                const badgePremium = (art.reserve_abonnes || art.contenu_premium) ? `<span class="card-premium-badge">Premium</span>` : '';

                conteneur.innerHTML += `
                    <div class="card" onclick="ouvrirArticle('${art.id}')">
                        ${imgStr}
                        <div class="card-content">
                            <div class="card-meta"><span class="card-categorie">${catNom}</span> ${badgePremium}</div>
                            <h2 class="card-titre titre-serif">${art.titre}</h2>
                            <div class="card-date">${date}</div>
                        </div>
                    </div>
                `;
            });
        }

        function ouvrirArticle(id) {
            articleActifId = id;
            const art = tousLesArticles.find(a => a.id === id);
            const catNom = toutesLesCategories.find(c => c.id === art.categorie_id)?.nom || 'Actualité';
            const date = new Date(art.date_publication).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year:'numeric' });
            
            document.getElementById('vue-grille').style.display = 'none';
            document.getElementById('vue-article').style.display = 'block';
            window.scrollTo(0, 0);

            const conteneur = document.getElementById('conteneur-article-complet');
            const imgStr = art.image_url ? `<img src="${art.image_url}" class="art-header-img" alt="cover">` : '';
            
            let html = `
                ${imgStr}
                <div class="card-categorie" style="margin-bottom:10px;">${catNom}</div>
                <h1 class="art-titre">${art.titre}</h1>
                <div class="art-meta"><span>Publié le ${date}</span></div>
            `;

            const accesAutorise = estAbonne || articlesOfferts.includes(id);

            if ((art.reserve_abonnes || art.contenu_premium) && !accesAutorise) {
                html += `
                <div class="art-contenu">${art.contenu_public}</div>
                <div class="paywall-box">
                    <div class="paywall-card">
                        <h3 class="titre-serif" style="font-size:1.8rem; margin:0 0 10px 0; color:var(--texte);">Réservé aux abonnés</h3>
                        <p style="color:var(--texte-clair); margin-bottom:20px;">Débloquez cet article et soutenez notre rédaction indépendante.</p>
                        <button class="btn btn-premium" style="width:100%; padding:15px; font-size:1.1rem;" onclick="ouvrirOffres()">Découvrir nos offres</button>
                    </div>
                </div>`;
            } else {
                if (articlesOfferts.includes(id) && !estAbonne) {
                    html += `<div class="cadeau-banner">🎁 Cet article exclusif vous a été offert par un abonné.</div>`;
                }
                
                html += `<div class="art-contenu">${art.contenu_public} ${art.contenu_premium ? art.contenu_premium : ''}</div>`;
                
                if (estAbonne && (art.reserve_abonnes || art.contenu_premium)) {
                    const btnStyle = creditsPartage > 0 ? "btn btn-primaire" : "btn btn-outline";
                    const actStr = creditsPartage > 0 ? "onclick='ouvrirPartage()'" : "disabled";
                    
                    html += `
                    <div class="share-box">
                        <div>
                            <h4 style="margin:0 0 5px 0;">Offrir cet article</h4>
                            <div style="font-size:0.9rem; color:var(--texte-clair);">Il vous reste ${creditsPartage} partage(s) ce mois-ci.</div>
                        </div>
                        <button class="${btnStyle}" ${actStr}>🎁 Partager</button>
                    </div>`;
                }
            }
            conteneur.innerHTML = html;
        }

        // --- ACTIONS UTILISATEURS ---
        async function sInscrire() {
            const email = document.getElementById('auth-email').value, password = document.getElementById('auth-password').value;
            const { data, error } = await db.auth.signUp({ email, password });
            if (error) alert(error.message);
            else { if (data.user) await db.from('lecteurs').insert([{ id: data.user.id, email }]); fermerModales(); initialiserSite(); }
        }
        async function seConnecter() {
            const email = document.getElementById('auth-email').value, password = document.getElementById('auth-password').value;
            const { error } = await db.auth.signInWithPassword({ email, password });
            if (error) alert("Identifiants incorrects."); else { fermerModales(); initialiserSite(); }
        }
        async function seDeconnecter() { await db.auth.signOut(); window.location.reload(); }

        async function validerPartage() {
            const emailAmi = document.getElementById('partage-email').value;
            if(!emailAmi) return;
            const { error } = await db.from('partages_articles').insert([{ article_id: articleActifId, lecteur_id: lecteurActuel.id, email_destinataire: emailAmi }]);
            if (error) alert("Erreur: " + error.message);
            else { 
                creditsPartage--; 
                await db.from('lecteurs').update({ credits_partage: creditsPartage }).eq('id', lecteurActuel.id);
                alert("Article offert avec succès !"); fermerModales(); ouvrirArticle(articleActifId); // Rafraîchit l'article
            }
        }

        async function ouvrirOffres() {
            if (!lecteurActuel) { ouvrirAuth(); return; }
            document.getElementById('offres-modal').style.display = 'flex';
            const conteneur = document.getElementById('liste-offres');
            const { data: offres } = await db.from('offres').select('*').order('prix_euros', { ascending: true });
            
            conteneur.innerHTML = '';
            offres.forEach(o => {
                const lien = `${o.stripe_price_id}?prefilled_email=${encodeURIComponent(lecteurActuel.email)}`;
                let av = '';
                if(o.avantages) o.avantages.split('\n').forEach(a => { if(a.trim()) av += `<li style="margin-bottom:10px; font-size:0.9rem;">✓ ${a}</li>`; });
                
                conteneur.innerHTML += `
                    <div class="offre-card">
                        <h3 class="titre-serif" style="margin-top:0;">${o.nom}</h3>
                        <div style="font-size:2.5rem; font-weight:800; color:var(--accent); margin:10px 0;">${o.prix_euros}€ <span style="font-size:1rem; color:var(--texte-clair); font-weight:500;">/mois</span></div>
                        <ul style="list-style:none; padding:0; margin-bottom:30px; flex-grow:1;">${av}</ul>
                        <a href="${lien}" class="btn btn-primaire" style="text-align:center; text-decoration:none;">S'abonner</a>
                    </div>`;
            });
        }

        function ouvrirAuth() { document.getElementById('auth-modal').style.display = 'flex'; }
        function ouvrirPartage() { document.getElementById('partage-modal').style.display = 'flex'; }
        function fermerModales() { document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none'); }
        function basculerModeAuth(m) { 
            document.getElementById('modal-titre').innerText = m === 'inscription' ? "Inscription" : "Connexion"; 
            document.getElementById('form-login').style.display = m === 'inscription' ? 'none' : 'block'; 
            document.getElementById('form-register').style.display = m === 'inscription' ? 'block' : 'none'; 
        }

        // Démarrage
        initialiserSite();
    </script>
</body>
</html>
